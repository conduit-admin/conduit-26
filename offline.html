<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Кондуит</title>
<style>
/* Кондуит — оформление.
   Палитра типов задач — проверенный категориальный набор (8 слотов),
   светлая и тёмная темы заданы отдельными шагами, а не автоматической инверсией. */

:root {
  color-scheme: light;

  --surface: #fcfcfb;
  --plane: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.1);
  --border-strong: rgba(11, 11, 11, 0.18);
  --wash: rgba(11, 11, 11, 0.04);
  --good: #006300;
  --bad: #d03b3b;

  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;
  --s7: #4a3aa7;
  --s8: #e34948;

  --cell-on: #23231f;
  --cell-off: #ecebe5;

  --radius: 10px;
  --tap: 44px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --surface: #1a1a19;
    --plane: #0d0d0d;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.2);
    --wash: rgba(255, 255, 255, 0.06);
    --good: #0ca30c;
    --bad: #e66767;

    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --s6: #008300;
    --s7: #9085e9;
    --s8: #e66767;

    --cell-on: #e8e7e2;
    --cell-off: #262624;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --surface: #1a1a19;
  --plane: #0d0d0d;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.1);
  --border-strong: rgba(255, 255, 255, 0.2);
  --wash: rgba(255, 255, 255, 0.06);
  --good: #0ca30c;
  --bad: #e66767;

  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --s6: #008300;
  --s7: #9085e9;
  --s8: #e66767;

  --cell-on: #e8e7e2;
  --cell-off: #262624;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--plane);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 16px 64px;
}

/* ── шапка ─────────────────────────────────────────────── */

.topbar {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 22px 0 14px;
}

.brand {
  font-size: 22px;
  font-weight: 620;
  letter-spacing: -0.01em;
}

.brand-sub {
  color: var(--ink-muted);
  font-size: 13px;
  font-weight: 400;
}

.spacer { flex: 1; }

.ghost-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  padding: 6px 12px;
  cursor: pointer;
  min-height: 32px;
}

.ghost-btn:hover { background: var(--wash); }

.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--grid);
  margin-bottom: 18px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--ink-muted);
  font: inherit;
  font-size: 14px;
  padding: 9px 12px;
  margin-bottom: -1px;
  cursor: pointer;
  white-space: nowrap;
}

.tab:hover { color: var(--ink-2); }

.tab[aria-selected="true"] {
  color: var(--ink);
  font-weight: 560;
  border-bottom-color: var(--ink);
}

/* ── карточки и фильтры ────────────────────────────────── */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}

.filters { margin-bottom: 14px; }

.filter-row + .filter-row {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--grid);
}

.filter-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 9px;
}

.filter-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.mini-btn {
  appearance: none;
  border: 0;
  background: none;
  color: var(--s1);
  font: inherit;
  font-size: 12.5px;
  padding: 2px 4px;
  cursor: pointer;
}

.mini-btn:hover { text-decoration: underline; }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  padding: 6px 12px;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}

.chip:hover { background: var(--wash); }

.chip[aria-pressed="false"] {
  color: var(--ink-muted);
  border-style: dashed;
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}

.chip[aria-pressed="false"] .dot { opacity: .28; }

/* выбор дня — это не фильтр, поэтому невыбранное не зачёркивается */
.chip.pick[aria-pressed="false"] {
  color: var(--ink-2);
  border-style: solid;
  text-decoration: none;
}

/* кнопка серии: номер и дата */
.chip.day {
  flex-direction: column;
  gap: 1px;
  min-width: 52px;
  padding: 5px 10px;
  font-variant-numeric: tabular-nums;
}

.chip.day b { font-size: 14px; font-weight: 620; line-height: 1.15; }
.chip.day small { font-size: 10px; line-height: 1.1; opacity: .72; letter-spacing: -0.01em; }

.chip[aria-pressed="true"].day {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}

.chip.day[aria-pressed="false"] {
  text-decoration: none;
  border-style: dashed;
  color: var(--ink-muted);
}

/* темы: раздел и его подразделы */
.tgroup {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  margin-top: 8px;
}

.chip.cat { font-weight: 560; }
.chip.cat.partial { border-style: dashed; }

.chip-count {
  font-size: 11px;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
}

.chip[aria-pressed="true"].cat .chip-count { color: var(--ink-muted); }

.subs { display: flex; flex-wrap: wrap; gap: 5px; }

.chip.sub {
  font-size: 12.5px;
  padding: 5px 10px 5px 9px;
  border-color: var(--border);
}

.chip.sub::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex: none;
  background: var(--accent);
}

.chip.sub[aria-pressed="true"] { color: var(--ink); }
.chip.sub[aria-pressed="false"]::before { opacity: .28; }

.dot {
  width: 9px;
  height: 9px;
  border-radius: 3px;
  flex: none;
}

.summary {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--grid);
  color: var(--ink-2);
  font-size: 13px;
}

.summary b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ── плитки ────────────────────────────────────────────── */

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}

.tile-label {
  font-size: 12px;
  color: var(--ink-muted);
  margin-bottom: 4px;
}

.tile-value {
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.tile-note {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 2px;
}

/* ── таблицы ───────────────────────────────────────────── */

.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-x: auto;
}

table.data {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

table.data th {
  text-align: right;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-muted);
  padding: 10px 12px;
  border-bottom: 1px solid var(--grid);
  white-space: nowrap;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;
}

table.data th.left, table.data td.left { text-align: left; }

table.data td {
  text-align: right;
  padding: 9px 12px;
  border-bottom: 1px solid var(--grid);
  white-space: nowrap;
}

table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover td { background: var(--wash); }
table.data tr.clickable { cursor: pointer; }

.rank {
  width: 1%;
  color: var(--ink-muted);
  font-size: 13px;
}

.rank-top { color: var(--ink); font-weight: 600; }

.name { font-weight: 500; }

.score { font-weight: 620; font-size: 16px; }

.muted { color: var(--ink-muted); }

.delta {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  min-width: 34px;
  justify-content: flex-end;
}

.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.delta.same { color: var(--ink-muted); }

.bar {
  display: inline-block;
  vertical-align: middle;
  height: 7px;
  border-radius: 4px;
  background: var(--s1);
  min-width: 2px;
}

.bar-track {
  display: inline-block;
  vertical-align: middle;
  width: 74px;
  height: 7px;
  border-radius: 4px;
  background: var(--cell-off);
  overflow: hidden;
  margin-right: 8px;
}

/* ── кондуит ───────────────────────────────────────────── */

.conduit-scroll {
  overflow-x: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

table.conduit {
  border-collapse: separate;
  border-spacing: 0;
  font-variant-numeric: tabular-nums;
}

table.conduit th, table.conduit td {
  padding: 0;
  font-size: 12px;
  font-weight: 400;
}

table.conduit th.pname, table.conduit td.pname {
  position: sticky;
  left: 0;
  z-index: 3;
  background: var(--surface);
  text-align: left;
  padding: 0 12px 0 14px;
  white-space: nowrap;
  border-right: 1px solid var(--grid);
  font-size: 13px;
  min-width: 150px;
}

table.conduit thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--surface);
  border-bottom: 1px solid var(--grid);
  height: 40px;
  vertical-align: bottom;
}

table.conduit thead th.pname { z-index: 4; }

.phead {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding-bottom: 6px;
  width: 26px;
}

.phead-id {
  font-size: 11.5px;
  color: var(--ink-2);
  letter-spacing: -0.02em;
}

.phead-rule {
  width: 20px;
  height: 3px;
  border-radius: 2px;
}

td.cell {
  width: 26px;
  height: 26px;
  text-align: center;
}

.mark {
  width: 20px;
  height: 20px;
  border-radius: 5px;
  background: var(--cell-off);
  margin: 0 auto;
}

.mark.on { background: var(--cell-on); }

tr.crow:hover td { background: var(--wash); }
tr.crow:hover td.pname { background: var(--wash); }

table.conduit tfoot td {
  border-top: 1px solid var(--grid);
  text-align: center;
  color: var(--ink-muted);
  font-size: 11px;
  height: 24px;
}

table.conduit tfoot td.pname {
  text-align: left;
  color: var(--ink-muted);
  font-size: 11.5px;
}

table.conduit tfoot tr.weights td { color: var(--ink-2); font-weight: 560; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin: 12px 0 0;
  font-size: 12.5px;
  color: var(--ink-2);
}

.legend-item { display: inline-flex; align-items: center; gap: 6px; }

/* ── прочее ────────────────────────────────────────────── */

.section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 22px 0 10px;
}

.section-title { font-size: 16px; font-weight: 600; }

.section-note { font-size: 12.5px; color: var(--ink-muted); }

.back-btn {
  appearance: none;
  border: 0;
  background: none;
  color: var(--s1);
  font: inherit;
  font-size: 13.5px;
  padding: 4px 0;
  cursor: pointer;
  margin-bottom: 6px;
}

.type-name { display: inline-flex; align-items: center; gap: 8px; }

/* блок темы: заголовок, полоса, строки подразделов */
.tblock { padding: 11px 0; border-bottom: 1px solid var(--grid); }
.tblock:first-child { padding-top: 2px; }
.tblock:last-child { border-bottom: 0; padding-bottom: 2px; }

.tblock-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 7px;
  font-size: 14px;
}

.subline {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 4px 0 0;
  font-size: 12.5px;
  color: var(--ink-2);
}

.subline-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subline-val { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* вкладка «Темы» — карточками, а не широкой таблицей */
.tcards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.tcard .subline { grid-template-columns: minmax(72px, 118px) 1fr auto; }

.tfacts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  margin: 9px 0 2px;
}

.tfact { display: flex; flex-direction: column; gap: 1px; }
.tfact-label { font-size: 11px; color: var(--ink-muted); }
.tfact-value { font-size: 14px; font-weight: 560; font-variant-numeric: tabular-nums; }

.tsubs { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--grid); }

.track {
  height: 8px;
  border-radius: 4px;
  background: var(--cell-off);
  overflow: hidden;
}

.track > i { display: block; height: 100%; border-radius: 4px; }
.track.thin { height: 6px; }

.type-val {
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  font-size: 13px;
  white-space: nowrap;
}

.series-mini {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.smini {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 12.5px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.smini b { color: var(--ink); font-weight: 600; }

.tip {
  position: fixed;
  z-index: 40;
  pointer-events: none;
  background: var(--ink);
  color: var(--surface);
  font-size: 12px;
  line-height: 1.35;
  padding: 6px 9px;
  border-radius: 7px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
  max-width: 220px;
  opacity: 0;
  transition: opacity .1s;
}

.tip.show { opacity: 1; }

.foot {
  margin-top: 26px;
  padding-top: 14px;
  border-top: 1px solid var(--grid);
  color: var(--ink-muted);
  font-size: 12.5px;
}

/* ── редактор ───────────────────────────────────────────── */

.field { display: flex; flex-direction: column; gap: 4px; }

.field-label {
  font-size: 11.5px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.input {
  appearance: none;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 8px 10px;
  min-height: 40px;
  min-width: 0;
}

.input:focus { outline: 2px solid var(--s1); outline-offset: -1px; }
.input.short { max-width: 120px; }
.input.tiny { width: 62px; text-align: center; font-variant-numeric: tabular-nums; }
select.input { padding-right: 6px; }

.frow {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px;
}

.frow.gap { margin-top: 10px; align-items: center; }

.primary-btn {
  appearance: none;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--surface);
  border-radius: 999px;
  font: inherit;
  font-size: 14px;
  font-weight: 560;
  padding: 9px 18px;
  min-height: 40px;
  cursor: pointer;
}

.primary-btn:disabled { opacity: .45; cursor: default; }

.icon-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-muted);
  border-radius: 8px;
  font: inherit;
  font-size: 17px;
  line-height: 1;
  width: 34px;
  min-height: 34px;
  cursor: pointer;
}

.icon-btn:hover { color: var(--bad); border-color: var(--bad); }

.prow {
  display: grid;
  grid-template-columns: 62px minmax(0, 1fr) minmax(0, 1fr) 34px 12px;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--grid);
}

.prow-dot { display: inline-flex; }

.chip.day.has-draft { position: relative; }

.chip.day.has-draft::after {
  content: "";
  position: absolute;
  top: 4px;
  right: 5px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--s2);
}

.chip.day.new { border-style: dashed; }
.chip.day.new b { font-size: 15px; }

/* сетка ввода: клетка — кнопка, палец крупнее курсора.
   min-width обязателен: без него браузер сжимает столбцы, когда таблица шире
   экрана, и клетка становится меньше пальца. */
table.conduit.edit td.cell,
table.conduit.edit thead th:not(.pname):not(.pcount) {
  width: 38px;
  min-width: 38px;
  height: 38px;
}

table.conduit.edit .mark {
  appearance: none;
  border: 0;
  padding: 0;
  width: 30px;
  height: 30px;
  cursor: pointer;
  display: block;
  margin: 0 auto;
}

table.conduit.edit .mark:active { transform: scale(.92); }

table.conduit .pcount {
  text-align: center;
  font-size: 11px;
  color: var(--ink-muted);
  padding: 0 8px;
  border-left: 1px solid var(--grid);
  font-variant-numeric: tabular-nums;
}

table.conduit tbody .pcount { font-size: 12px; }
table.conduit .pcount.total { color: var(--ink); font-weight: 600; }

.savebar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border-strong);
  box-shadow: 0 -6px 18px rgba(0, 0, 0, .07);
}

.savebar-info {
  flex: 1;
  min-width: 0;
  font-size: 12.5px;
  color: var(--ink-2);
}

.banner {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 13.5px;
  margin-bottom: 14px;
}

.banner.good { border-color: var(--good); color: var(--ink); }
.banner.bad { border-color: var(--bad); color: var(--ink); }

.banner-link { color: var(--s1); font-size: 13px; white-space: nowrap; }

  border: 0;
  background: none;

  font-size: 16px;
  line-height: 1;
  padding: 0 2px;
  cursor: pointer;
}

.chip.day.pending {

}

.savebar[hidden] { display: none; }

.savebar-info.bad { color: var(--bad); }
.savebar-info.good { color: var(--good); }

  .prow > select.input:nth-child(3) { grid-column: 2; grid-row: 2; }

],"vereschagin-gosha":["6б"],"gavrilov-timur":["3а","6б"],"gordeeva-liza":["3а"],"dementev-matvey":["2","4","6б","7","10"],"erohina-dasha":["2","3а","3б","4","5","6а","6б","10"],"zhukovskiy-mark":["3а"],"zayceva-polina":["1","2","3а","3б","4","5","6б","7","9","10"],"ilin-serezha":["1","2","3а","3б","4","5","6а","6б","7","9"],"karpova-anya":["2","3а","10"],"kovalev-dima":["2","3а","3б","10"],"lebedeva-masha":["2","3а","3б","4","5","6б"],"lozinskiy-artem":["1","2","3б","6а","6б"],"mescheryakova-vera":["1","2","3а","3б","4","6б","10"],"nikitin-egor":["1","2","3б","4","6а","6б","7","10"],"orlova-ksyusha":["2"],"pankratov-lesha":["3а","3б","6а","6б","10"],"prohorova-yulya":["2","3а","3б","4","5","6а","6б","9","10"],"romanov-vanya":["3а","3б","4","6б","9"],"saveleva-katya":["6б"],"sizov-misha":["3а"],"tarasova-olya":["1","2","4","5","6б","10"],"ustinov-pasha":["3а","6а","6б"],"fomina-rita":["1","2","3а","3б","4","5","6б","9","10"],"hrustalev-kostya":["3а","3б","4","6б","9","10"],"chernova-zhenya":["1","2","3а","3б","4","6б","9"],"shapovalov-roma":["1","2","3а","3б","5","6б","7","10"],"yakovleva-nina":["2","3а","5","6б"]}}]};</script>
<script>
/* Кондуит — весь подсчёт идёт в браузере читателя.
   Данные приходят одним из двух способов:
     1) window.__CONDUIT__ — офлайн-сборка, всё зашито в один файл;
     2) fetch из папки data/ — обычный режим на сайте.

   Темы двухуровневые: раздел (Алгебра, Геометрия, Комбинаторика, Теория чисел)
   и необязательный подраздел. Единица фильтрации — «лист»: раздел без
   подразбиения или пара раздел+подраздел. Задача без указанного подраздела
   попадает в лист «без уточнения» своего раздела — так новые подразделы можно
   добавлять по ходу смены, ничего не ломая. */

(function () {
  "use strict";

  var DATA = null;    // {config, types, students, series}
  var UNITS = [];     // плоский список единиц зачёта: решившие, вес, лист темы
  var CAT = {};       // id раздела -> раздел
  var LEAVES = [];    // [{key, catId, catName, subId, subName, slot, label}]
  var LEAF = {};      // key -> лист
  var FULL = null;    // рейтинг без фильтров — для сравнения мест

  var state = {
    view: "rating",
    leaves: new Set(),
    series: new Set(),
    openSeries: 1,
    openStudent: null
  };

  var MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня",
    "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  var MONTHS_SHORT = ["янв", "фев", "мар", "апр", "мая", "июн",
    "июл", "авг", "сен", "окт", "ноя", "дек"];

  // ── мелкие помощники ────────────────────────────────────

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function num(n) { return Number(n).toLocaleString("ru-RU"); }

  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function withNum(n, one, few, many) {
    return num(n) + " " + plural(n, one, few, many);
  }

  function prettyDate(iso, short) {
    var p = String(iso).split("-");
    if (p.length !== 3) return iso;
    var m = (short ? MONTHS_SHORT : MONTHS)[Number(p[1]) - 1];
    return Number(p[2]) + " " + m;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function pct(x) { return Math.round(x * 100) + "%"; }

  // ── подготовка данных ───────────────────────────────────

  function leafKey(catId, subId) { return catId + "/" + (subId || ""); }

  function buildIndex() {
    CAT = {};
    DATA.types.forEach(function (t) { CAT[t.id] = t; });

    // какие пары раздел+подраздел реально встречаются в данных
    var seen = {};
    DATA.series.forEach(function (s) {
      s.problems.forEach(function (p) { seen[leafKey(p.type, p.sub)] = true; });
    });

    LEAVES = [];
    LEAF = {};
    DATA.types.forEach(function (t) {
      var subs = t.subs || [];
      subs.forEach(function (sub) {
        add(t, sub.id, sub.name, t.name + " · " + sub.name);
      });
      // раздел без подразбиения — либо задачи, которым подраздел не проставили
      if (!subs.length || seen[leafKey(t.id, null)]) {
        add(t, null, subs.length ? "без уточнения" : null,
          subs.length ? t.name + " · без уточнения" : t.name);
      }
    });

    function add(t, subId, subName, label) {
      var leaf = {
        key: leafKey(t.id, subId),
        catId: t.id,
        catName: t.name,
        subId: subId,
        subName: subName,
        slot: t.slot,
        label: label
      };
      LEAVES.push(leaf);
      LEAF[leaf.key] = leaf;
    }

    UNITS = [];
    DATA.series.forEach(function (s) {
      s.problems.forEach(function (p) {
        var solvers = [];
        DATA.students.forEach(function (st) {
          var list = s.solved[st.id];
          if (list && list.indexOf(p.id) !== -1) solvers.push(st.id);
        });
        UNITS.push({
          sn: s.n,
          id: p.id,
          leafKey: leafKey(p.type, p.sub),
          catId: p.type,
          solvers: solvers,
          solverSet: new Set(solvers),
          weight: DATA.config.students_total - solvers.length
        });
      });
    });

    state.leaves = new Set(LEAVES.map(function (l) { return l.key; }));
    state.series = new Set(DATA.series.map(function (s) { return s.n; }));
    state.openSeries = DATA.series.length ? DATA.series[DATA.series.length - 1].n : 1;
    FULL = computeRating(state.series, state.leaves);
  }

  function catLeaves(catId) {
    return LEAVES.filter(function (l) { return l.catId === catId; });
  }

  function computeRating(seriesSet, leafSet) {
    var rows = DATA.students.map(function (s) {
      return { id: s.id, name: s.name, score: 0, pluses: 0 };
    });
    var byId = {};
    rows.forEach(function (r) { byId[r.id] = r; });

    var available = 0, ceiling = 0;
    UNITS.forEach(function (u) {
      if (!seriesSet.has(u.sn) || !leafSet.has(u.leafKey)) return;
      available += 1;
      ceiling += u.weight;
      u.solvers.forEach(function (id) {
        var r = byId[id];
        if (!r) return;
        r.score += u.weight;
        r.pluses += 1;
      });
    });

    rows.sort(function (a, b) {
      return b.score - a.score || b.pluses - a.pluses || a.name.localeCompare(b.name, "ru");
    });

    var rank = 0, prev = null;
    rows.forEach(function (r, i) {
      var key = r.score + "/" + r.pluses;
      if (key !== prev) { rank = i + 1; prev = key; }
      r.rank = rank;
    });

    var place = {};
    rows.forEach(function (r) { place[r.id] = r.rank; });

    return { rows: rows, available: available, ceiling: ceiling, place: place };
  }

  function filtered() { return computeRating(state.series, state.leaves); }

  function filterActive() {
    return state.leaves.size !== LEAVES.length || state.series.size !== DATA.series.length;
  }

  // ── подсказки ───────────────────────────────────────────

  var tip = null;

  function showTip(target, html) {
    if (!tip) {
      tip = el("div", "tip");
      document.body.appendChild(tip);
    }
    tip.innerHTML = html;
    tip.classList.add("show");
    var r = target.getBoundingClientRect();
    var t = tip.getBoundingClientRect();
    var left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
    var top = r.top - t.height - 8;
    if (top < 8) top = r.bottom + 8;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }

  function hideTip() { if (tip) tip.classList.remove("show"); }

  function tipify(node, html) {
    node.addEventListener("mouseenter", function () { showTip(node, html); });
    node.addEventListener("mouseleave", hideTip);
  }

  // ── общие детали ────────────────────────────────────────

  function dot(slot) {
    var d = el("span", "dot");
    d.style.background = "var(--s" + slot + ")";
    return d;
  }

  function mini(text, fn) {
    var b = el("button", "mini-btn", text);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }

  function dayChip(s, pressed, extraClass, onClick) {
    var b = el("button", "chip day" + (extraClass ? " " + extraClass : ""));
    b.type = "button";
    b.setAttribute("aria-pressed", pressed ? "true" : "false");
    b.appendChild(el("b", null, s.n));
    b.appendChild(el("small", null, prettyDate(s.date, true)));
    tipify(b, "Серия " + s.n + " · " + prettyDate(s.date) + "<br>" +
      withNum(s.problems.length, "задача", "задачи", "задач"));
    b.addEventListener("click", onClick);
    return b;
  }

  function tile(label, value, note) {
    var t = el("div", "tile");
    t.appendChild(el("div", "tile-label", label));
    t.appendChild(el("div", "tile-value", value));
    if (note) t.appendChild(el("div", "tile-note", note));
    return t;
  }

  function th(text, cls) { return el("th", cls, text); }

  // ── фильтры ─────────────────────────────────────────────

  function renderFilters(host) {
    var card = el("div", "card filters");

    // темы
    var r1 = el("div", "filter-row");
    var h1 = el("div", "filter-head");
    h1.appendChild(el("span", "filter-title", "Темы"));
    h1.appendChild(mini("все", function () {
      state.leaves = new Set(LEAVES.map(function (l) { return l.key; }));
      render();
    }));
    h1.appendChild(mini("ни одной", function () {
      state.leaves = new Set();
      render();
    }));
    r1.appendChild(h1);

    DATA.types.forEach(function (t) {
      var leaves = catLeaves(t.id);
      if (!leaves.length) return;
      var on = leaves.filter(function (l) { return state.leaves.has(l.key); }).length;

      var group = el("div", "tgroup");

      var cat = el("button", "chip cat" + (on && on < leaves.length ? " partial" : ""));
      cat.type = "button";
      cat.setAttribute("aria-pressed", on ? "true" : "false");
      cat.appendChild(dot(t.slot));
      cat.appendChild(document.createTextNode(t.name));
      if (leaves.length > 1) {
        cat.appendChild(el("span", "chip-count", on + "/" + leaves.length));
      }
      cat.addEventListener("click", function () {
        var all = on === leaves.length;
        leaves.forEach(function (l) {
          if (all) state.leaves.delete(l.key); else state.leaves.add(l.key);
        });
        render();
      });
      group.appendChild(cat);

      if (leaves.length > 1 || leaves[0].subName) {
        var subs = el("div", "subs");
        leaves.forEach(function (l) {
          var b = el("button", "chip sub", l.subName || t.name);
          b.type = "button";
          b.setAttribute("aria-pressed", state.leaves.has(l.key) ? "true" : "false");
          b.style.setProperty("--accent", "var(--s" + t.slot + ")");
          b.addEventListener("click", function () {
            if (state.leaves.has(l.key)) state.leaves.delete(l.key);
            else state.leaves.add(l.key);
            render();
          });
          subs.appendChild(b);
        });
        group.appendChild(subs);
      }

      r1.appendChild(group);
    });
    card.appendChild(r1);

    // серии
    var r2 = el("div", "filter-row");
    var h2 = el("div", "filter-head");
    h2.appendChild(el("span", "filter-title", "Серии"));
    h2.appendChild(mini("все", function () {
      state.series = new Set(DATA.series.map(function (s) { return s.n; }));
      render();
    }));
    h2.appendChild(mini("последние 5", function () {
      state.series = new Set(DATA.series.slice(-5).map(function (s) { return s.n; }));
      render();
    }));
    h2.appendChild(mini("ни одной", function () {
      state.series = new Set();
      render();
    }));
    r2.appendChild(h2);

    var c2 = el("div", "chips");
    DATA.series.forEach(function (s) {
      c2.appendChild(dayChip(s, state.series.has(s.n), null, function () {
        if (state.series.has(s.n)) state.series.delete(s.n);
        else state.series.add(s.n);
        render();
      }));
    });
    r2.appendChild(c2);
    card.appendChild(r2);

    var f = filtered();
    var sum = el("div", "summary");
    sum.innerHTML =
      "Учтено <b>" + state.series.size + "</b> из " + DATA.series.length + " " +
      plural(DATA.series.length, "серии", "серий", "серий") +
      " · <b>" + f.available + "</b> из " + UNITS.length + " задач" +
      " · потолок <b>" + num(f.ceiling) + "</b> " + plural(f.ceiling, "балл", "балла", "баллов");
    card.appendChild(sum);

    host.appendChild(card);
    return f;
  }

  // ── вид: рейтинг ────────────────────────────────────────

  function viewRating(host) {
    var f = renderFilters(host);
    var active = filterActive();

    var tiles = el("div", "tiles");
    tiles.appendChild(tile("Учеников", num(DATA.config.students_total),
      "число зафиксировано в начале смены"));
    tiles.appendChild(tile("Серий в фильтре", state.series.size + " / " + DATA.series.length, null));
    tiles.appendChild(tile("Задач в фильтре", f.available + " / " + UNITS.length, null));
    tiles.appendChild(tile("Потолок баллов", num(f.ceiling), "если решить всё учтённое"));
    host.appendChild(tiles);

    var wrap = el("div", "table-wrap");
    var table = el("table", "data");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(th("№", "rank"));
    if (active) hr.appendChild(th("сдвиг"));
    hr.appendChild(th("Ученик", "left"));
    hr.appendChild(th("Баллы"));
    hr.appendChild(th("Плюсы"));
    hr.appendChild(th("Доля решённого", "left"));
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el("tbody");
    f.rows.forEach(function (r) {
      var tr = el("tr", "clickable");
      tr.addEventListener("click", function () {
        state.openStudent = r.id;
        state.view = "students";
        render();
        window.scrollTo(0, 0);
      });

      tr.appendChild(el("td", "rank" + (r.rank <= 3 ? " rank-top" : ""), r.rank));

      if (active) {
        var was = FULL.place[r.id];
        var d = was - r.rank;
        var cell = el("td");
        var span = el("span", "delta " + (d > 0 ? "up" : d < 0 ? "down" : "same"));
        span.textContent = d > 0 ? "▲ " + d : d < 0 ? "▼ " + (-d) : "—";
        tipify(span, "Без фильтра — " + was + " место");
        cell.appendChild(span);
        tr.appendChild(cell);
      }

      tr.appendChild(el("td", "left name", r.name));
      tr.appendChild(el("td", "score", num(r.score)));
      tr.appendChild(el("td", "muted", r.pluses));

      var share = f.available ? r.pluses / f.available : 0;
      var td = el("td", "left");
      var track = el("span", "bar-track");
      var bar = el("span", "bar");
      bar.style.width = Math.max(2, Math.round(share * 74)) + "px";
      track.appendChild(bar);
      td.appendChild(track);
      td.appendChild(el("span", "muted", pct(share)));
      tr.appendChild(td);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    host.appendChild(wrap);

    var note = el("div", "foot");
    note.textContent = "Вес задачи = " + DATA.config.students_total +
      " − число решивших. Задача, которую сдали трое, стоит " +
      (DATA.config.students_total - 3) + " баллов; задача, которую сдали все, — 0. " +
      "Вес не зависит от выбранного фильтра, поэтому рейтинги сопоставимы между собой.";
    host.appendChild(note);
  }

  // ── вид: кондуиты ───────────────────────────────────────

  function viewSeries(host) {
    var picker = el("div", "card");
    var head = el("div", "filter-head");
    head.appendChild(el("span", "filter-title", "День"));
    picker.appendChild(head);
    var chips = el("div", "chips");
    DATA.series.forEach(function (s) {
      chips.appendChild(dayChip(s, s.n === state.openSeries, "pick", function () {
        state.openSeries = s.n;
        render();
      }));
    });
    picker.appendChild(chips);
    host.appendChild(picker);

    var s = DATA.series.filter(function (x) { return x.n === state.openSeries; })[0];
    if (!s) return;

    var units = UNITS.filter(function (u) { return u.sn === s.n; });
    var byId = {};
    units.forEach(function (u) { byId[u.id] = u; });

    var sh = el("div", "section-head");
    sh.appendChild(el("span", "section-title", "Серия " + s.n));
    sh.appendChild(el("span", "section-note", prettyDate(s.date) + " · " +
      withNum(s.problems.length, "задача", "задачи", "задач") + " · всего сдано " +
      withNum(units.reduce(function (a, u) { return a + u.solvers.length; }, 0),
        "плюс", "плюса", "плюсов")));
    host.appendChild(sh);

    var scroll = el("div", "conduit-scroll");
    var table = el("table", "conduit");

    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(el("th", "pname", "Ученик"));
    s.problems.forEach(function (p) {
      var leaf = LEAF[leafKey(p.type, p.sub)];
      var slot = leaf ? leaf.slot : (CAT[p.type] ? CAT[p.type].slot : 1);
      var cell = el("th");
      var box = el("div", "phead");
      box.appendChild(el("div", "phead-id", p.id));
      var rule = el("div", "phead-rule");
      rule.style.background = "var(--s" + slot + ")";
      box.appendChild(rule);
      cell.appendChild(box);
      tipify(cell, "Задача " + p.id + " · " + (leaf ? leaf.label : p.type) +
        "<br>решили " + byId[p.id].solvers.length + " из " + DATA.config.students_total +
        " · вес " + byId[p.id].weight);
      hr.appendChild(cell);
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    // строки — в порядке результата этой серии
    var order = computeRating(new Set([s.n]),
      new Set(LEAVES.map(function (l) { return l.key; }))).rows;

    var tbody = el("tbody");
    order.forEach(function (r) {
      var tr = el("tr", "crow");
      tr.appendChild(el("td", "pname", r.name));
      s.problems.forEach(function (p) {
        var u = byId[p.id];
        var on = u.solverSet.has(r.id);
        var td = el("td", "cell");
        td.appendChild(el("div", "mark" + (on ? " on" : "")));
        tipify(td, r.name + "<br>задача " + p.id + " — " + (on ? "плюс, +" + u.weight : "нет"));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    var tfoot = el("tfoot");
    var f1 = el("tr");
    f1.appendChild(el("td", "pname", "решили"));
    s.problems.forEach(function (p) { f1.appendChild(el("td", null, byId[p.id].solvers.length)); });
    tfoot.appendChild(f1);
    var f2 = el("tr", "weights");
    f2.appendChild(el("td", "pname", "вес"));
    s.problems.forEach(function (p) { f2.appendChild(el("td", null, byId[p.id].weight)); });
    tfoot.appendChild(f2);
    table.appendChild(tfoot);

    scroll.appendChild(table);
    host.appendChild(scroll);

    // легенда — только темы, встретившиеся в этой серии
    var used = {};
    s.problems.forEach(function (p) { used[leafKey(p.type, p.sub)] = true; });
    var legend = el("div", "legend");
    DATA.types.forEach(function (t) {
      var mine = catLeaves(t.id).filter(function (l) { return used[l.key]; });
      if (!mine.length) return;
      var item = el("span", "legend-item");
      item.appendChild(dot(t.slot));
      var names = mine.map(function (l) { return l.subName; }).filter(Boolean);
      item.appendChild(document.createTextNode(
        t.name + (names.length ? " · " + names.join(", ") : "")));
      legend.appendChild(item);
    });
    host.appendChild(legend);
  }

  // ── вид: ученики ────────────────────────────────────────

  function viewStudents(host) {
    if (state.openStudent) return viewStudentCard(host, state.openStudent);

    var f = renderFilters(host);
    var wrap = el("div", "table-wrap");
    var table = el("table", "data");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(th("№", "rank"));
    hr.appendChild(th("Ученик", "left"));
    hr.appendChild(th("Баллы"));
    hr.appendChild(th("Плюсы"));
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el("tbody");
    DATA.students.slice().sort(function (a, b) {
      return a.name.localeCompare(b.name, "ru");
    }).forEach(function (s) {
      var row = f.rows.filter(function (r) { return r.id === s.id; })[0];
      var tr = el("tr", "clickable");
      tr.addEventListener("click", function () {
        state.openStudent = s.id;
        render();
        window.scrollTo(0, 0);
      });
      tr.appendChild(el("td", "rank", row.rank));
      tr.appendChild(el("td", "left name", s.name));
      tr.appendChild(el("td", "score", num(row.score)));
      tr.appendChild(el("td", "muted", row.pluses));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    host.appendChild(wrap);
  }

  function viewStudentCard(host, id) {
    var back = el("button", "back-btn", "← ко всем ученикам");
    back.type = "button";
    back.addEventListener("click", function () { state.openStudent = null; render(); });
    host.appendChild(back);

    var student = DATA.students.filter(function (s) { return s.id === id; })[0];
    var f = filtered();
    var row = f.rows.filter(function (r) { return r.id === id; })[0];

    var sh = el("div", "section-head");
    sh.appendChild(el("span", "section-title", student.name));
    if (filterActive()) {
      sh.appendChild(el("span", "section-note",
        "по текущему фильтру · без фильтра " + FULL.place[id] + " место"));
    }
    host.appendChild(sh);

    var tiles = el("div", "tiles");
    tiles.appendChild(tile("Место", row.rank + " / " + DATA.students.length, null));
    tiles.appendChild(tile("Баллы", num(row.score), "из " + num(f.ceiling) + " возможных"));
    tiles.appendChild(tile("Плюсы", row.pluses + " / " + f.available, null));
    var best = bestProblem(id);
    tiles.appendChild(tile("Самый ценный плюс", best ? "+" + best.weight : "—",
      best ? "серия " + best.sn + ", задача " + best.id : null));
    host.appendChild(tiles);

    var sh2 = el("div", "section-head");
    sh2.appendChild(el("span", "section-title", "По темам"));
    sh2.appendChild(el("span", "section-note", "по выбранным сериям, темы показаны все"));
    host.appendChild(sh2);

    var card = el("div", "card");
    DATA.types.forEach(function (t) {
      var leaves = catLeaves(t.id);
      if (!leaves.length) return;

      var catStat = statFor(leaves.map(function (l) { return l.key; }), id);
      var block = el("div", "tblock");

      var head = el("div", "tblock-head");
      var nameBox = el("span", "type-name");
      nameBox.appendChild(dot(t.slot));
      nameBox.appendChild(el("b", null, t.name));
      head.appendChild(nameBox);
      head.appendChild(el("span", "type-val",
        catStat.got + " / " + catStat.total + " · " + num(catStat.score) + " б."));
      block.appendChild(head);

      block.appendChild(trackBar(catStat.total ? catStat.got / catStat.total : 0, t.slot));

      if (leaves.length > 1 || leaves[0].subName) {
        leaves.forEach(function (l) {
          var st = statFor([l.key], id);
          var line = el("div", "subline");
          line.appendChild(el("span", "subline-name", l.subName || t.name));
          line.appendChild(el("span", "subline-val",
            st.got + " / " + st.total + " · " + num(st.score)));
          block.appendChild(line);
        });
      }

      card.appendChild(block);
    });
    host.appendChild(card);

    var sh3 = el("div", "section-head");
    sh3.appendChild(el("span", "section-title", "По сериям"));
    host.appendChild(sh3);

    var mini2 = el("div", "series-mini");
    DATA.series.forEach(function (s) {
      var got = 0, total = 0, score = 0;
      UNITS.forEach(function (u) {
        if (u.sn !== s.n) return;
        total += 1;
        if (u.solverSet.has(id)) { got += 1; score += u.weight; }
      });
      var b = el("span", "smini");
      b.innerHTML = "С" + s.n + " · <b>" + got + "</b>/" + total + " · " + num(score);
      tipify(b, prettyDate(s.date) + "<br>" + withNum(score, "балл", "балла", "баллов"));
      mini2.appendChild(b);
    });
    host.appendChild(mini2);
  }

  function statFor(keys, studentId) {
    var set = new Set(keys);
    var total = 0, got = 0, score = 0, solvers = 0, weight = 0;
    UNITS.forEach(function (u) {
      if (!set.has(u.leafKey) || !state.series.has(u.sn)) return;
      total += 1;
      solvers += u.solvers.length;
      weight += u.weight;
      if (studentId && u.solverSet.has(studentId)) { got += 1; score += u.weight; }
    });
    return {
      total: total,
      got: got,
      score: score,
      rate: total ? solvers / (total * DATA.config.students_total) : 0,
      avgWeight: total ? weight / total : 0
    };
  }

  function trackBar(share, slot) {
    var track = el("div", "track");
    var fill = el("i");
    fill.style.width = Math.round(share * 100) + "%";
    fill.style.background = "var(--s" + slot + ")";
    track.appendChild(fill);
    return track;
  }

  function bestProblem(id) {
    var best = null;
    UNITS.forEach(function (u) {
      if (!u.solverSet.has(id)) return;
      if (!best || u.weight > best.weight) best = u;
    });
    return best;
  }

  // ── вид: темы ───────────────────────────────────────────

  function viewTypes(host) {
    var note = el("div", "section-note");
    note.textContent = "По сериям, выбранным в фильтре на вкладке «Рейтинг». " +
      "Решаемость — какая доля учеников в среднем берёт задачу этой темы.";
    host.appendChild(note);

    var grid = el("div", "tcards");

    DATA.types.forEach(function (t) {
      var leaves = catLeaves(t.id);
      if (!leaves.length) return;
      var st = statFor(leaves.map(function (l) { return l.key; }), null);
      if (!st.total) return;

      var card = el("div", "card tcard");

      var head = el("div", "tblock-head");
      var nameBox = el("span", "type-name");
      nameBox.appendChild(dot(t.slot));
      nameBox.appendChild(el("b", null, t.name));
      head.appendChild(nameBox);
      head.appendChild(el("span", "type-val", withNum(st.total, "задача", "задачи", "задач")));
      card.appendChild(head);

      var facts = el("div", "tfacts");
      facts.appendChild(fact("решаемость", pct(st.rate)));
      facts.appendChild(fact("средний вес", st.avgWeight.toFixed(1)));
      var top = computeRating(state.series,
        new Set(leaves.map(function (l) { return l.key; }))).rows[0];
      facts.appendChild(fact("лучший", top ? top.name : "—"));
      card.appendChild(facts);

      if (leaves.length > 1 || leaves[0].subName) {
        var subs = el("div", "tsubs");
        leaves.forEach(function (l) {
          var ls = statFor([l.key], null);
          var line = el("div", "subline");
          line.appendChild(el("span", "subline-name", l.subName || t.name));
          var bar = trackBar(ls.rate, t.slot);
          bar.className = "track thin";
          line.appendChild(bar);
          line.appendChild(el("span", "subline-val",
            ls.total + " " + plural(ls.total, "задача", "задачи", "задач") + " · " + pct(ls.rate)));
          subs.appendChild(line);
        });
        card.appendChild(subs);
      }

      grid.appendChild(card);
    });

    host.appendChild(grid);
  }

  function fact(label, value) {
    var f = el("div", "tfact");
    f.appendChild(el("span", "tfact-label", label));
    f.appendChild(el("span", "tfact-value", value));
    return f;
  }

  // ── каркас ──────────────────────────────────────────────

  function render() {
    hideTip();
    var main = document.getElementById("main");
    clear(main);

    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
      t.setAttribute("aria-selected", t.dataset.view === state.view ? "true" : "false");
    });

    if (state.view === "rating") viewRating(main);
    else if (state.view === "series") viewSeries(main);
    else if (state.view === "students") viewStudents(main);
    else if (state.view === "types") viewTypes(main);
  }

  function setupChrome() {
    document.getElementById("brand-title").textContent = DATA.config.title;
    var sub = DATA.config.subtitle || "";
    if (DATA.config.offline_date) {
      var d = String(DATA.config.offline_date).split("-");
      sub += (sub ? " · " : "") + "офлайн-копия от " + d[2] + "." + d[1] + "." + d[0];
    }
    document.getElementById("brand-sub").textContent = sub;
    document.title = DATA.config.title + " — " + (DATA.config.subtitle || "");

    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
      t.addEventListener("click", function () {
        state.view = t.dataset.view;
        if (state.view !== "students") state.openStudent = null;
        render();
      });
    });

    var saved = null;
    try { saved = localStorage.getItem("conduit-theme"); } catch (e) { /* приватный режим */ }
    if (saved) document.documentElement.setAttribute("data-theme", saved);

    document.getElementById("theme").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      var next;
      if (cur) next = cur === "dark" ? "light" : "dark";
      else next = window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("conduit-theme", next); } catch (e) { /* пусто */ }
    });

    window.addEventListener("scroll", hideTip, { passive: true });
  }

  function boot(data) {
    DATA = data;
    DATA.series.sort(function (a, b) { return a.n - b.n; });
    buildIndex();
    setupChrome();
    render();
  }

  function loadFromFiles() {
    var base = "data/";
    function get(path) {
      return fetch(base + path, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error(path + ": " + r.status);
        return r.json();
      });
    }
    return Promise.all([
      get("config.json"), get("types.json"), get("students.json"), get("series/manifest.json")
    ]).then(function (res) {
      return Promise.all(res[3].series.map(function (f) { return get("series/" + f); }))
        .then(function (series) {
          return { config: res[0], types: res[1], students: res[2], series: series };
        });
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    if (window.__CONDUIT__) { boot(window.__CONDUIT__); return; }
    loadFromFiles().then(boot).catch(function (err) {
      var main = document.getElementById("main");
      clear(main);
      var box = el("div", "card");
      box.appendChild(el("div", "section-title", "Не удалось загрузить данные"));
      box.appendChild(el("div", "tile-note", String(err.message || err)));
      box.appendChild(el("div", "tile-note",
        "Если файл открыт с диска напрямую, браузер не даёт читать соседние файлы — " +
        "для локального просмотра используйте офлайн-сборку."));
      main.appendChild(box);
    });
  });
})();

</script>
</body>
</html>
