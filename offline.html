<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Кондуит</title>
<style>
/* Кондуит — оформление.
   Палитра типов задач — проверенный категориальный набор (8 слотов),
   светлая и тёмная темы заданы отдельными шагами, а не автоматической инверсией. */

:root {
  color-scheme: light dark;

  --surface: #fcfcfb;
  --plane: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.1);
  --border-strong: rgba(11, 11, 11, 0.18);
  --wash: rgba(11, 11, 11, 0.04);
  --good: #006300;
  --bad: #d03b3b;

  /* Цвета тем различаются прежде всего тоном, а не яркостью: тон переживает
     любое затемнение, яркость — нет. Фиолетовый уведён от синего подальше:
     прежний #4a3aa7 был почти той же тёмной синевой, и под фильтром
     принудительной тёмной темы они сливались. */
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;
  --s7: #8e3fd6;
  --s8: #e34948;

  /* Разрыв между «решено» и «нет» намеренно большой: часть браузеров на
     телефонах затемняет крупные заливки по-своему, и слабую разницу такое
     затемнение стирает совсем. */
  /* Клетка кондуита. Пустая — заметная заливка с обводкой, решённая — плотная
     заливка обратной яркости со знаком поверх. В каждой теме пара «пустая /
     решённая» строится одинаково, только в разные стороны: в светлой решённая
     темнее фона, в тёмной — светлее. */
  --cell-on: #3d3b33;
  --cell-off: #e6e3d4;
  --cell-edge: #cbc7b3;
  --cell-ink: #fcfcfb;
  /* пустой квадрат шкалы — свой цвет, а не цвет пустой клетки кондуита:
     в кондуите он почти сливается с подложкой намеренно, в шкале должен
     быть виден, иначе не поймёшь, из чего доля */
  --meter-off: #c9c6b7;

  --admin: #a1245e;
  --leader: #4f6b00;

  --radius: 10px;
  --tap: 44px;
}

/* Тёмная тема — свой набор шагов под тёмную подложку, а не инверсия светлой.
   Пока страница объявляла «только светлая», браузер затемнял её сам и портил
   цвета; со своим набором мы решаем это сами. */
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1a1a19;
    --plane: #0d0d0d;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.12);
    --border-strong: rgba(255, 255, 255, 0.24);
    --wash: rgba(255, 255, 255, 0.07);
    --good: #0ca30c;
    --bad: #e66767;

    /* На тёмной подложке цвет должен быть светлее, чем на светлой, а не темнее.
       Прежний набор был темнее светлого — отсюда «цвета тем слишком тёмные и
       сливаются». Все восемь дают против подложки не меньше 7:1. */
    --s1: #66b2ff;
    --s2: #ff9e57;
    --s3: #3fd6a0;
    --s4: #f3c53f;
    --s5: #ff92b8;
    --s6: #85dc5e;
    --s7: #c48cff;
    --s8: #ff8585;

    --cell-on: #ccc6a9;
    --cell-off: #45443f;
    --cell-edge: #605e55;
    --cell-ink: #16150f;
    --meter-off: #454440;

    --admin: #f08fb8;
    --leader: #c9f24f;
  }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
}

html {
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
  /* Место под полосу прокрутки держим всегда. Без этого на короткой вкладке
     («Темы») полоса пропадает, окно становится шире на её толщину, и вся
     страница дёргается вбок при каждом переключении. */
  scrollbar-gutter: stable;
}

/* Синий прямоугольник при касании складывается из двух вещей: подсветки самого
   касания и выделения текста внутри кнопки. Гасим обе, но оставляем видимую
   рамку для клавиатуры. */
button, .chip, .tab, .mark, .cal-day, .picker-btn, a.ghost-btn {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

:focus:not(:focus-visible) { outline: none; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--plane);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 16px 64px;
}

/* ── шапка ─────────────────────────────────────────────── */

.topbar {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 22px 0 14px;
}

.brand {
  font-size: 22px;
  font-weight: 620;
  letter-spacing: -0.01em;
}

.brand-sub {
  color: var(--ink-muted);
  font-size: 13px;
  font-weight: 400;
}

.spacer { flex: 1; }

.ghost-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  padding: 6px 12px;
  cursor: pointer;
  min-height: 32px;
}

.ghost-btn:hover { background: var(--wash); }

/* «К сайту» в шапке редактора: заметнее обычной ghost-кнопки, со стрелкой,
   которая отъезжает при наведении и нажатии — маленький намёк на переход */
.topbar .ghost-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 15px;
  min-height: 36px;
  font-size: 13px;
  font-weight: 560;
  color: var(--ink);
  border-color: var(--border-strong);
  text-decoration: none;
}

.topbar .ghost-btn::after {
  content: "→";
  font-size: 14px;
  line-height: 1;
  color: var(--ink-muted);
  transition: transform .18s cubic-bezier(.2, .8, .3, 1), color .18s ease;
}

.topbar .ghost-btn:hover {
  border-color: var(--ink);
  background: var(--wash);
}

.topbar .ghost-btn:hover::after {
  transform: translateX(3px);
  color: var(--ink);
}

.topbar .ghost-btn.tap::after { animation: nudge .32s cubic-bezier(.2, .8, .3, 1); }

@keyframes nudge {
  0% { transform: translateX(0); }
  45% { transform: translateX(5px); }
  100% { transform: translateX(0); }
}

.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--grid);
  margin-bottom: 18px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

/* Вес шрифта у выбранной вкладки не меняется: от смены веса меняется ширина,
   и соседние вкладки съезжают при каждом переключении. Выбранная опознаётся
   цветом и подчёркиванием, ширина остаётся той же. */
.tab {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--ink-muted);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  padding: 9px 12px;
  margin-bottom: -1px;
  cursor: pointer;
  white-space: nowrap;
  transition: color .16s ease, border-bottom-color .16s ease;
}

.tab:hover { color: var(--ink-2); }
.tab:focus { outline: none; }

.tab:focus-visible {
  outline: 2px solid var(--s1);
  outline-offset: -2px;
  border-radius: 6px;
}

.tab[aria-selected="true"] {
  color: var(--ink);
  border-bottom-color: var(--ink);
}

/* ── карточки и фильтры ────────────────────────────────── */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}

.filters { margin-bottom: 14px; }

.filter-row + .filter-row {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--grid);
}

.filter-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 9px;
}

.filter-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* Не голубая ссылка, а маленькая кнопка: голубой в этом интерфейсе занят под
   цвет темы «Алгебра», и надпись читалась как ещё один ярлык темы. */
.mini-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  font: inherit;
  font-size: 12px;
  line-height: 1;
  padding: 6px 11px;
  cursor: pointer;
}

.mini-btn:hover {
  background: var(--wash);
  border-color: var(--border-strong);
  color: var(--ink);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  padding: 6px 12px;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}

.chip:hover { background: var(--wash); }

.chip[aria-pressed="false"] {
  color: var(--ink-muted);
  border-style: dashed;
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}

.chip[aria-pressed="false"] .dot { opacity: .28; }

/* Выбор одного из вариантов — не фильтр: невыбранное здесь не «исключено»,
   поэтому не зачёркивается. Выбранное обводится жирнее. */
.chip.pick[aria-pressed="false"] {
  color: var(--ink-2);
  border-style: solid;
  text-decoration: none;
}

.chip.pick[aria-pressed="false"] .dot,
.chip.sub.pick[aria-pressed="false"]::before { opacity: 1; }

.chip.pick[aria-pressed="true"] {
  border-color: var(--ink);
  background: var(--wash);
  color: var(--ink);
}

/* кнопка серии: номер и дата. Серий за смену два десятка, поэтому кнопка
   плотная — иначе выбор дня занимает пол-экрана. */
.chip.day {
  flex-direction: column;
  gap: 0;
  min-width: 44px;
  padding: 4px 8px;
  font-variant-numeric: tabular-nums;
}

/* гробарий — одиночная кнопка, дата ему не нужна */
.chip.day.wide { flex-direction: row; padding: 8px 16px; }
.chip.day.wide b { font-size: 13.5px; }

.chip.day b { font-size: 13px; font-weight: 620; line-height: 1.2; }
.chip.day small { font-size: 9.5px; line-height: 1.15; opacity: .72; letter-spacing: -0.02em; }

.chip[aria-pressed="true"].day {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}

.chip.day[aria-pressed="false"] {
  text-decoration: none;
  border-style: dashed;
  color: var(--ink-muted);
}

/* темы: раздел и его подразделы */
.tgroup {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  margin-top: 8px;
}

.chip.cat { font-weight: 560; }
.chip.cat.partial { border-style: dashed; }

.chip-count {
  font-size: 11px;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
}

.chip[aria-pressed="true"].cat .chip-count { color: var(--ink-muted); }

.subs { display: flex; flex-wrap: wrap; gap: 5px; }

.chip.sub {
  font-size: 12.5px;
  padding: 5px 10px 5px 9px;
  border-color: var(--border);
}

.chip.sub::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex: none;
  background: var(--accent);
}

.chip.sub[aria-pressed="true"] { color: var(--ink); }
.chip.sub[aria-pressed="false"]::before { opacity: .28; }

.dot {
  width: 9px;
  height: 9px;
  border-radius: 3px;
  flex: none;
}

.summary {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--grid);
  color: var(--ink-2);
  font-size: 13px;
}

.summary b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ── плитки ────────────────────────────────────────────── */

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}

.tile-label {
  font-size: 12px;
  color: var(--ink-muted);
  margin-bottom: 4px;
}

.tile-value {
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.tile-note {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 2px;
}

/* ── таблицы ───────────────────────────────────────────── */

.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-x: auto;
}

table.data {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

table.data th {
  text-align: right;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-muted);
  padding: 10px 12px;
  border-bottom: 1px solid var(--grid);
  white-space: nowrap;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;
}

table.data th.left, table.data td.left { text-align: left; }

table.data td {
  text-align: right;
  padding: 9px 12px;
  border-bottom: 1px solid var(--grid);
  white-space: nowrap;
}

table.data tbody tr:last-child td { border-bottom: 0; }

table.data tfoot td {
  border-top: 1px solid var(--axis);
  border-bottom: 0;
  color: var(--ink-2);
  font-weight: 560;
}

table.data tfoot .name { color: var(--ink-muted); font-weight: 600; }
table.data tbody tr:hover td { background: var(--wash); }
table.data tr.clickable { cursor: pointer; }

.rank {
  width: 1%;
  color: var(--ink-muted);
  font-size: 13px;
}

.rank-top { color: var(--ink); font-weight: 600; }

.name { font-weight: 500; }

.score { font-weight: 620; font-size: 16px; }

.muted { color: var(--ink-muted); }

.delta {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  min-width: 34px;
  justify-content: flex-end;
}

.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.delta.same { color: var(--ink-muted); }

/* Все цветные заливки — чистым цветом, без картинок-градиентов. Градиент здесь
   пробовался как защита от принудительной тёмной темы и дал обратный эффект:
   в Samsung Internet тускнеет именно он, а плоский цвет остаётся как задан. */
.bar {
  display: inline-block;
  vertical-align: middle;
  height: 7px;
  border-radius: 4px;
  background: var(--s1);
  min-width: 2px;
}

.bar-track {
  display: inline-block;
  vertical-align: middle;
  width: 74px;
  height: 7px;
  border-radius: 4px;
  background: var(--cell-off);
  overflow: hidden;
  margin-right: 8px;
}

/* ── кондуит ───────────────────────────────────────────── */

/* Кондуит — две таблицы бок о бок: фамилии не прокручиваются, клетки
   прокручиваются. Высоты строк заданы жёстко, иначе половинки разъедутся. */
.conduit-split {
  display: flex;
  align-items: stretch;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

table.conduit.names {
  flex: none;
  border-right: 1px solid var(--grid);
}

.conduit-scroll {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
}

table.conduit thead th { height: 40px; }
table.conduit tbody td { height: 38px; }
table.conduit tfoot td { height: 26px; }

table.conduit {
  border-collapse: separate;
  border-spacing: 0;
  font-variant-numeric: tabular-nums;
}

table.conduit th, table.conduit td {
  padding: 0;
  font-size: 12px;
  font-weight: 400;
}

table.conduit th.pname, table.conduit td.pname {
  background: var(--surface);
  text-align: left;
  padding: 0 12px 0 14px;
  white-space: nowrap;
  font-size: 15px;
  min-width: 176px;
  max-width: 176px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* столбец фамилий оформлен как в рейтинге: тот же кегль, вес и отбивка */
table.conduit tbody td.pname {
  height: 32px;
  font-weight: 500;
  color: var(--ink);
  padding: 0 14px;
}

table.conduit thead th.pname,
table.conduit tfoot td.pname {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* Админ кондуита помечен знаком, а не цветом: цвет отдан первому месту,
   иначе две разные вещи спорили бы за одно средство. */
.admin::after {
  content: "◆";
  margin-left: 6px;
  font-size: 0.8em;
  color: var(--admin);
}

/* Правило столбца фамилий задаёт цвет и перебивает .leader по весу селектора,
   поэтому лидер прописан здесь отдельно — иначе в кондуите он оставался белым. */
.leader,
table.conduit tbody td.pname.leader { color: var(--leader); font-weight: 600; }

table.conduit thead th {
  background: var(--surface);
  border-bottom: 1px solid var(--grid);
  height: 40px;
  vertical-align: bottom;
}

.phead {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding-bottom: 6px;
  width: 38px;
}

.phead-id {
  font-size: 11.5px;
  color: var(--ink-2);
  letter-spacing: -0.02em;
}

.phead-rule {
  width: 20px;
  height: 3px;
  border-radius: 2px;
}

/* Клетка одинакова на сайте и в редакторе: размер выбран под палец, но и
   читается на просмотре лучше мелкой. min-width обязателен — без него браузер
   сжимает столбцы, когда таблица шире экрана. */
td.cell {
  width: 38px;
  min-width: 38px;
  height: 38px;
  text-align: center;
  position: relative;
  z-index: 0;
}

/* Клетка кондуита. Плюс — настоящий знак, а не белая полоска поверх тёмного
   квадрата: браузеры с принудительной тёмной темой инвертируют цвета сами, и
   конструкция «фон плюс накладка» под инверсией теряет контраст. Текст же
   инвертируется вместе с фоном, поэтому знак виден в любой теме.

   Обводка пустой клетки задана внутренней тенью, а не рамкой: рамка меняет
   размер коробки, и клетка дёргалась бы при простановке плюса. */
.mark {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  margin: 0 auto;
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
  color: transparent;
  background: var(--cell-off);
  box-shadow: inset 0 0 0 1px var(--cell-edge);
}

.mark.on {
  background: var(--cell-on);
  color: var(--cell-ink);
  box-shadow: none;
}

/* Кондуит смотрят, а не трогают: имена не выделяются и не отзываются нигде,
   клетки — везде, кроме редактора. Прокрутка вбок остаётся: касание достаётся
   прокручиваемой обёртке, а не таблице внутри неё. */
.conduit-split {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  cursor: default;
}

table.conduit.names,
table.conduit.cells:not(.edit) { pointer-events: none; }

table.conduit tfoot td {
  border-top: 1px solid var(--grid);
  text-align: center;
  color: var(--ink-muted);
  font-size: 11px;
  height: 24px;
}

table.conduit tfoot td.pname {
  text-align: left;
  color: var(--ink-muted);
  font-size: 11.5px;
}

table.conduit tfoot tr.weights td { color: var(--ink-2); font-weight: 560; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin: 12px 0 0;
  font-size: 12.5px;
  color: var(--ink-2);
}

.legend-item { display: inline-flex; align-items: center; gap: 6px; }

/* ── прочее ────────────────────────────────────────────── */

.section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 22px 0 10px;
}

.section-title { font-size: 16px; font-weight: 600; white-space: nowrap; }

.section-note { font-size: 12.5px; color: var(--ink-muted); }

/* та же маленькая кнопка, что «все» и «последние 5» */
.back-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  font: inherit;
  font-size: 12px;
  line-height: 1;
  padding: 7px 12px;
  cursor: pointer;
  margin-bottom: 10px;
}

.back-btn:hover {
  background: var(--wash);
  border-color: var(--border-strong);
  color: var(--ink);
}

.type-name { display: inline-flex; align-items: center; gap: 8px; }

/* блок темы: заголовок, полоса, строки подразделов */
.tblock { padding: 11px 0; border-bottom: 1px solid var(--grid); }
.tblock:first-child { padding-top: 2px; }
.tblock:last-child { border-bottom: 0; padding-bottom: 2px; }

.tblock-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 7px;
  font-size: 14px;
}

.subline {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 4px 0 0;
  font-size: 12.5px;
  color: var(--ink-2);
}

.subline-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subline-val { font-variant-numeric: tabular-nums; white-space: nowrap; }

.confirm {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.confirm-text { color: var(--ink); font-size: 12.5px; }
.mini-btn.danger { color: var(--bad); border-color: var(--bad); }

/* Шкала решаемости — ряд мелких блоков вместо одной широкой заливки: крупную
   плоскую заливку принудительная тёмная тема телефона гасит, мелкую оставляет.
   Незакрашенные блоки заодно показывают, из чего доля считается. */
.meter {
  display: flex;
  gap: 2px;
  align-items: center;
}

/* Размер квадрата задан жёстко, а не долей ширины: шкалы должны быть одной
   длины во всех строках, иначе их не сравнить взглядом. */
.meter > i {
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  background: var(--meter-off);
}

/* шкала подтемы мельче шкалы раздела, но делений столько же */
.meter.small > i { width: 7px; height: 7px; }

/* Строка «название — шкала — счёт». Шкала и счёт имеют жёсткую ширину, имя
   забирает остаток — поэтому шкала стоит на одном месте во всех строках, как
   бы ни звалась тема. Отступ подтемы сделан внутри её колонки имени, а не
   отступом строки: иначе он сдвинул бы и шкалу. */
.pline {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 108px 54px;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  max-width: 430px;
}

.pline.sub .pline-name { padding-left: 14px; }

.pline-name {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 560;
}

.pline.sub .pline-name {
  font-weight: 400;
  font-size: 12.5px;
  color: var(--ink-2);
}

.pline-val {
  font-size: 12.5px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

td .date { margin-left: 8px; font-size: 12px; }

.type-val {
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  font-size: 13px;
  white-space: nowrap;
}

.series-mini {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.smini {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 12.5px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.smini b { color: var(--ink); font-weight: 600; }

.tip {
  position: fixed;
  z-index: 40;
  pointer-events: none;
  background: var(--ink);
  color: var(--surface);
  font-size: 12px;
  line-height: 1.35;
  padding: 6px 9px;
  border-radius: 7px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
  max-width: 220px;
  opacity: 0;
  transition: opacity .1s;
}

.tip.show { opacity: 1; }

.foot {
  margin-top: 26px;
  padding-top: 14px;
  border-top: 1px solid var(--grid);
  color: var(--ink-muted);
  font-size: 12.5px;
}

/* ── движение ───────────────────────────────────────────
   Анимируется только смена раздела и отклик на касание. Перерисовка от
   фильтра ничего не анимирует: таблица мигала бы на каждый чип. */

@keyframes rise {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: none; }
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.view-enter > * { animation: rise .24s cubic-bezier(.2, .7, .3, 1) both; }
.view-enter > *:nth-child(2) { animation-delay: .04s; }
.view-enter > *:nth-child(3) { animation-delay: .07s; }
.view-enter > *:nth-child(n+4) { animation-delay: .09s; }

/* строки таблиц набегают по очереди — но только первые полтора десятка,
   дальше задержка перестаёт читаться и превращается в ожидание */
.view-enter table.data tbody tr,
.view-enter table.conduit tbody tr { animation: fade .3s ease-out both; }

.view-enter tbody tr:nth-child(1) { animation-delay: .06s; }
.view-enter tbody tr:nth-child(2) { animation-delay: .08s; }
.view-enter tbody tr:nth-child(3) { animation-delay: .1s; }
.view-enter tbody tr:nth-child(4) { animation-delay: .12s; }
.view-enter tbody tr:nth-child(5) { animation-delay: .14s; }
.view-enter tbody tr:nth-child(6) { animation-delay: .16s; }
.view-enter tbody tr:nth-child(7) { animation-delay: .18s; }
.view-enter tbody tr:nth-child(8) { animation-delay: .2s; }
.view-enter tbody tr:nth-child(9) { animation-delay: .22s; }
.view-enter tbody tr:nth-child(10) { animation-delay: .24s; }
.view-enter tbody tr:nth-child(n+11) { animation-delay: .26s; }

.view-enter .tile { animation: rise .28s cubic-bezier(.2, .7, .3, 1) both; }
.view-enter .chips > * { animation: fade .3s ease-out both; }

.banner { animation: rise .2s ease-out both; }

.card { transition: border-color .16s ease; }
.tile { transition: transform .16s ease, border-color .16s ease; }
.tile:hover { transform: translateY(-1px); border-color: var(--border-strong); }
.smini { transition: background-color .14s ease, border-color .14s ease; }
.smini:hover { border-color: var(--border-strong); background: var(--wash); }
.back-btn { transition: opacity .14s ease; }
.back-btn:hover { opacity: .7; }
.delta { transition: color .16s ease; }

/* Отклик на касание. На телефоне подсветка касания погашена нарочно, поэтому
   без этого кнопки кажутся мёртвыми: нажал — и ничего. Сжатие берём
   преобразованием, оно не трогает разметку и ничего не сдвигает вокруг. */
.chip, .ghost-btn, .primary-btn, .icon-btn, .mini-btn, .back-btn,
.tab, .cal-day, .cal-nav, .banner-close, .picker-btn {
  transition: background-color .14s ease, color .14s ease,
              border-color .14s ease, opacity .14s ease;
}

/* Класс ставится на нажатие из скрипта, анимация доигрывает сама. Через
   :active на телефоне это не работает: браузер придерживает состояние, пока
   не убедится, что палец не поехал прокручивать. */
@keyframes tap {
  0% { transform: scale(.92); }
  100% { transform: scale(1); }
}

@keyframes tapRow {
  0% { background: var(--wash); }
  100% { background: transparent; }
}

/* Класс продублирован нарочно: иначе первые полсекунды после смены раздела
   отклик глушился бы анимацией входа, у которой вес селектора выше. */
.tap.tap { animation: tap .19s cubic-bezier(.2, .8, .3, 1); }

/* строку рейтинга не сжимаем — по ширине экрана это выглядит рывком; вместо
   этого она отзывается подсветкой */
tr.clickable.tap.tap { animation: none; }
tr.clickable.tap td { animation: tapRow .4s ease-out; }

table.conduit.edit .mark { transition: background-color .14s ease; }

.smini { transition: background-color .14s ease, border-color .14s ease; }

table.data tbody tr { transition: background-color .12s ease; }
.mark { transition: background-color .14s ease; }
.bar { transition: width .25s cubic-bezier(.2, .7, .3, 1); }
.meter > i { transition: background-color .16s ease; }

.tip { animation: fade .12s ease-out both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
    transition-duration: .01ms !important;
  }
}

/* ── редактор ───────────────────────────────────────────── */

.field { display: flex; flex-direction: column; gap: 4px; }

.field-label {
  font-size: 11.5px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.input {
  appearance: none;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 8px 10px;
  min-height: 40px;
  min-width: 0;
}

.input:focus { outline: 2px solid var(--s1); outline-offset: -1px; }
.input.short { max-width: 120px; }
.frow.top > .field:first-child { flex: 0 0 110px; }
.input.tiny { width: 62px; text-align: center; font-variant-numeric: tabular-nums; }
select.input { padding-right: 6px; }

.frow {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px;
}

.frow.gap { margin-top: 10px; align-items: center; }

/* когда в строке раскрыт календарь, соседние поля не должны прилипать к его низу */
.frow.top { align-items: flex-start; }
.frow.top > .field { flex: 1 1 190px; }

.primary-btn {
  appearance: none;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--surface);
  border-radius: 999px;
  font: inherit;
  font-size: 14px;
  font-weight: 560;
  padding: 9px 18px;
  min-height: 40px;
  cursor: pointer;
}

.primary-btn:disabled { opacity: .45; cursor: default; }

.primary-btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.ghost-btn.danger { color: var(--bad); border-color: var(--bad); }

.icon-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-muted);
  border-radius: 8px;
  font: inherit;
  font-size: 17px;
  line-height: 1;
  width: 34px;
  min-height: 34px;
  cursor: pointer;
}

.icon-btn:hover { color: var(--bad); border-color: var(--bad); }

.prow-wrap { padding: 7px 0; border-bottom: 1px solid var(--grid); }

.prow {
  display: grid;
  grid-template-columns: 62px minmax(0, 1fr) 34px;
  align-items: center;
  gap: 8px;
}

.chip.day.has-draft { position: relative; }

.chip.day.has-draft::after {
  content: "";
  position: absolute;
  top: 4px;
  right: 5px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--s2);
}

/* у гроба правится только число, буква Г — подпись слева от поля */
.prow.grave { grid-template-columns: 80px minmax(0, 1fr) 34px; }

.grave-id {
  display: flex;
  align-items: center;
  gap: 4px;
}

.grave-pre {
  font-size: 15px;
  font-weight: 560;
  color: var(--ink-2);
}

.chip.day.new { border-style: dashed; }
.chip.day.new b { font-size: 15px; }

table.conduit thead th:not(.pname):not(.pcount) {
  width: 38px;
  min-width: 38px;
}

/* В редакторе клетка — кнопка. Сжатие при нажатии безопасно: фамилии живут в
   отдельной таблице, наехать на них клетке нечем. */
table.conduit.edit .mark {
  appearance: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

/* Простановка плюса: короткое сжатие с лёгким перелётом обратно. Одна
   величина, одно свойство — этого хватает, чтобы касание чувствовалось. */
@keyframes markOn {
  0% { transform: scale(.7); }
  55% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

@keyframes markOff {
  0% { transform: scale(.86); }
  100% { transform: scale(1); }
}

table.conduit.edit .mark.pop { animation: markOn .22s cubic-bezier(.2, .8, .3, 1); }
table.conduit.edit .mark.drop { animation: markOff .16s ease-out; }

table.conduit .pcount {
  text-align: center;
  font-size: 11px;
  color: var(--ink-muted);
  padding: 0 8px;
  border-left: 1px solid var(--grid);
  font-variant-numeric: tabular-nums;
}

table.conduit tbody .pcount { font-size: 12px; }
table.conduit .pcount.total { color: var(--ink); font-weight: 600; }

/* Режим редактора помечен у заголовка тем же знаком и цветом, что и админ. */
body.is-editor .brand::after {
  content: "◆";
  margin-left: 8px;
  font-size: 0.8em;
  color: var(--admin);
}

/* карточка сохранения */
.savecard {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
}

.savecard-main { flex: 1; min-width: 0; }
.savecard-title { font-size: 14px; }
.savecard-note { font-size: 12.5px; color: var(--ink-muted); margin-top: 2px; }

/* свои выпадающие меню вместо системных */
.picker-btn {
  appearance: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  transition: border-color .14s ease, background-color .14s ease;
}

.picker-btn.open { border-color: var(--ink); }
.picker-btn:active { transform: scale(.99); }

.picker-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.picker-caret { color: var(--ink-muted); font-size: 11px; flex: none; }

.chooser {
  margin: 8px 0 2px;
  padding: 10px;
  border: 1px solid var(--grid);
  border-radius: 10px;
  background: var(--plane);
  animation: rise .16s ease-out both;
}

.chooser .subs-row { margin-top: 8px; }

.chooser-sep {
  height: 1px;
  background: var(--grid);
  margin: 10px 0;
}

.datefield { position: relative; min-width: 190px; }

.calendar {
  margin-top: 8px;
  padding: 10px;
  border: 1px solid var(--grid);
  border-radius: 10px;
  background: var(--plane);
  animation: rise .16s ease-out both;
}

.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.cal-title { font-size: 14px; font-weight: 560; }

.cal-nav {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 8px;
  font: inherit;
  font-size: 16px;
  line-height: 1;
  width: 34px;
  height: 34px;
  cursor: pointer;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.cal-wd {
  text-align: center;
  font-size: 11px;
  color: var(--ink-muted);
  padding-bottom: 2px;
}

.cal-empty { height: 36px; }

.cal-day {
  appearance: none;
  border: 1px solid transparent;
  background: var(--surface);
  color: var(--ink);
  border-radius: 8px;
  font: inherit;
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
  height: 36px;
  cursor: pointer;
  transition: background-color .12s ease, color .12s ease;
}

.cal-day:hover { background: var(--wash); }
.cal-day.today { border-color: var(--border-strong); }

.cal-day.sel {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
  font-weight: 600;
}

.cal-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--grid);
}

.color-chip { padding: 8px 12px; }

.banner {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 13.5px;
  margin-bottom: 14px;
}

.banner.good { border-color: var(--good); color: var(--ink); }
.banner.bad { border-color: var(--bad); color: var(--ink); }
.banner > span { flex: 1; min-width: 0; }
.banner-link { color: var(--s1); font-size: 13px; white-space: nowrap; }

.banner-close {
  appearance: none;
  border: 0;
  background: none;
  color: var(--ink-muted);
  font: inherit;
  font-size: 16px;
  line-height: 1;
  padding: 0 2px;
  cursor: pointer;
}

.chip.day.pending {
  border-style: dotted;
  color: var(--ink-muted);
}


@media (max-width: 560px) {
  .prow { grid-template-columns: 48px minmax(0, 1fr) 32px; column-gap: 8px; }
  .prow.grave { grid-template-columns: 66px minmax(0, 1fr) 32px; }
  .input.tiny { width: 48px; }
  .datefield { min-width: 0; }
}

@media (max-width: 560px) {
  .wrap { padding: 0 12px 48px; }
  .brand { font-size: 19px; }
  .tile-value { font-size: 23px; }
  table.data td, table.data th { padding: 9px 8px; }
  .bar-track { display: none; }
  .pline { gap: 8px; }
  table.conduit th.pname, table.conduit td.pname {
    min-width: 118px;
    font-size: 13px;
    padding: 0 8px 0 10px;
  }
}

1","Г3"],"boyko-gleb":["Г4"],"gulev-maksim":["Г4"],"zarechnyuk-georgiy":["Г3"],"karonov-mihail":[],"karev-denis":["Г1"],"kovalev-artem":["Г1","Г3"],"kostylev-konstantin":[],"larionova-natalya":["Г2","Г4"],"lyubimov-slaven":[],"mahrov-aleksandr":["Г2","Г4"],"novoselov-maksim":["Г1"],"osipova-viktoriya":["Г4"],"pogorelov-denis":["Г2"],"rudakova-vasilisa":["Г4"],"strelkov-sergey":["Г3","Г4"],"titov-viktor":["Г2"],"titov-dmitriy":["Г1","Г3","Г4"],"celikov-aleksandr":["Г2","Г4"],"shipilov-andrey":["Г1"],"shirtanova-valeriya":["Г2","Г3"]}}};</script>
<script>
/* Кондуит — весь подсчёт идёт в браузере читателя.
   Данные приходят одним из двух способов:
     1) window.__CONDUIT__ — офлайн-сборка, всё зашито в один файл;
     2) fetch из папки data/ — обычный режим на сайте.

   Темы двухуровневые: раздел (Алгебра, Геометрия, Комбинаторика, Теория чисел)
   и необязательный подраздел. Единица фильтрации — «лист»: раздел без
   подразбиения или пара раздел+подраздел. Задаче разбитого раздела подраздел
   ставят всегда; если он всё же пуст или незнаком, лист заводится по факту
   данных — иначе такая задача молча выпала бы из рейтинга. */

(function () {
  "use strict";

  var DATA = null;    // {config, types, students, series}
  var UNITS = [];     // плоский список единиц зачёта: решившие, вес, лист темы
  var CAT = {};       // id раздела -> раздел
  var LEAVES = [];    // [{key, catId, catName, subId, subName, slot, label}]
  var LEAF = {};      // key -> лист
  var FULL = null;    // рейтинг по всему сразу — им определяется лидер смены

  var state = {
    view: "rating",
    leaves: new Set(),
    series: new Set(),
    kinds: new Set(["problem", "exercise", "grave"]),
    openSeries: 1,
    openStudent: null
  };

  var GRAVES = "graves";   // такой же «день» в списке кондуитов, только без даты

  var MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня",
    "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  var MONTHS_SHORT = ["янв", "фев", "мар", "апр", "мая", "июн",
    "июл", "авг", "сен", "окт", "ноя", "дек"];

  // ── мелкие помощники ────────────────────────────────────

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function num(n) { return Number(n).toLocaleString("ru-RU"); }

  function prettyDate(iso, short) {
    var p = String(iso).split("-");
    if (p.length !== 3) return iso;
    var m = (short ? MONTHS_SHORT : MONTHS)[Number(p[1]) - 1];
    return Number(p[2]) + " " + m;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function pct(x) { return Math.round(x * 100) + "%"; }

  /* Средний балл — сколько очков в среднем приносит один плюс: видно, берёт
     человек дорогие задачи или много дешёвых. */
  function avgScore(score, pluses) {
    return pluses ? (score / pluses).toFixed(3) : "—";
  }

  function isAdmin(id) { return DATA.config.admin && id === DATA.config.admin; }

  function nameCell(tag, cls, student) {
    return el(tag, cls +
      (isAdmin(student.id) ? " admin" : "") +
      (isLeader(student.id) ? " leader" : ""), student.name);
  }

  // ── подготовка данных ───────────────────────────────────

  function leafKey(catId, subId) { return catId + "/" + (subId || ""); }

  /* Гробарий — задачи вне серий: они не привязаны ко дню и потому не попадают
     под отбор по сериям, зато включаются и выключаются отдельным признаком. */
  function graves() { return (DATA.graves && DATA.graves.problems) || []; }

  function graveSolved(id) {
    return (DATA.graves && DATA.graves.solved && DATA.graves.solved[id]) || [];
  }

  function buildIndex() {
    CAT = {};
    DATA.types.forEach(function (t) { CAT[t.id] = t; });

    // какие пары раздел+подраздел реально встречаются в данных
    var seen = {};
    DATA.series.forEach(function (s) {
      s.problems.forEach(function (p) { seen[leafKey(p.type, p.sub)] = true; });
    });
    graves().forEach(function (p) { seen[leafKey(p.type, p.sub)] = true; });

    LEAVES = [];
    LEAF = {};
    DATA.types.forEach(function (t) {
      var subs = t.subs || [];
      subs.forEach(function (sub) {
        add(t, sub.id, sub.name, t.name + " · " + sub.name);
      });
      // раздел без подразбиения — один лист на весь раздел
      if (!subs.length) add(t, null, null, t.name);
    });

    /* Подраздел мог появиться в данных раньше, чем в types.json (например,
       файл серии уехал, а список тем — ещё нет). Заводим лист по факту данных,
       иначе такие задачи молча выпали бы из рейтинга. */
    Object.keys(seen).forEach(function (key) {
      if (LEAF[key]) return;
      var parts = key.split("/");
      var cat = CAT[parts[0]] || { id: parts[0], name: parts[0], slot: 8 };
      var subId = parts[1] || null;
      add(cat, subId, subId, cat.name + (subId ? " · " + subId : ""));
    });

    function add(t, subId, subName, label) {
      var leaf = {
        key: leafKey(t.id, subId),
        catId: t.id,
        catName: t.name,
        subId: subId,
        subName: subName,
        slot: t.slot,
        label: label
      };
      LEAVES.push(leaf);
      LEAF[leaf.key] = leaf;
    }

    UNITS = [];
    DATA.series.forEach(function (s) {
      s.problems.forEach(function (p) {
        var solvers = [];
        DATA.students.forEach(function (st) {
          var list = s.solved[st.id];
          if (list && list.indexOf(p.id) !== -1) solvers.push(st.id);
        });
        UNITS.push({
          sn: s.n,
          id: p.id,
          leafKey: leafKey(p.type, p.sub),
          catId: p.type,
          kind: p.exercise ? "exercise" : "problem",
          solvers: solvers,
          solverSet: new Set(solvers),
          weight: DATA.config.students_total - solvers.length
        });
      });
    });

    graves().forEach(function (p) {
      var solvers = [];
      DATA.students.forEach(function (st) {
        if (graveSolved(st.id).indexOf(p.id) !== -1) solvers.push(st.id);
      });
      UNITS.push({
        sn: null,
        id: p.id,
        leafKey: leafKey(p.type, p.sub),
        catId: p.type,
        kind: "grave",
        solvers: solvers,
        solverSet: new Set(solvers),
        weight: DATA.config.students_total - solvers.length
      });
    });

    state.leaves = new Set(LEAVES.map(function (l) { return l.key; }));
    state.series = new Set(DATA.series.map(function (s) { return s.n; }));
    state.openSeries = DATA.series.length
      ? DATA.series[DATA.series.length - 1].n
      : GRAVES;

    /* Лидер смены считается по всему сразу и не зависит от фильтров: он помечен
       одинаково на любой вкладке и при любом отборе. */
    FULL = computeRating(state.series, state.leaves, ALL_KINDS);
  }

  function isLeader(id) {
    return !!FULL && FULL.place[id] === 1 && FULL.rows[0].score > 0;
  }

  var KINDS = [["problem", "Задачи"], ["exercise", "Упражнения"], ["grave", "Гробы"]];
  var ALL_KINDS = new Set(KINDS.map(function (p) { return p[0]; }));

  function allLeaves() {
    return new Set(LEAVES.map(function (l) { return l.key; }));
  }

  function catLeaves(catId) {
    return LEAVES.filter(function (l) { return l.catId === catId; });
  }

  function computeRating(seriesSet, leafSet, kindSet) {
    kindSet = kindSet || state.kinds;
    var rows = DATA.students.map(function (s) {
      return { id: s.id, name: s.name, score: 0, pluses: 0 };
    });
    var byId = {};
    rows.forEach(function (r) { byId[r.id] = r; });

    var available = 0, ceiling = 0;
    UNITS.forEach(function (u) {
      if (u.sn !== null && !seriesSet.has(u.sn)) return;
      if (!leafSet.has(u.leafKey) || !kindSet.has(u.kind)) return;
      available += 1;
      ceiling += u.weight;
      u.solvers.forEach(function (id) {
        var r = byId[id];
        if (!r) return;
        r.score += u.weight;
        r.pluses += 1;
      });
    });

    rows.sort(function (a, b) {
      return b.score - a.score || b.pluses - a.pluses || a.name.localeCompare(b.name, "ru");
    });

    var rank = 0, prev = null;
    rows.forEach(function (r, i) {
      var key = r.score + "/" + r.pluses;
      if (key !== prev) { rank = i + 1; prev = key; }
      r.rank = rank;
    });

    var place = {};
    rows.forEach(function (r) { place[r.id] = r.rank; });

    return { rows: rows, available: available, ceiling: ceiling, place: place };
  }

  function filtered() { return computeRating(state.series, state.leaves, state.kinds); }

  // ── общие детали ────────────────────────────────────────

  /* Заливка задаётся обычным цветом. Приём с картинкой-градиентом вместо цвета
     здесь вреден: в Samsung Internet затемняются как раз градиенты, а плоский
     цвет остаётся как задан. Проверено на самом кондуите — полоска темы там
     единственная осталась на чистом цвете и единственная рисовалась верно. */
  function dot(slot) {
    var d = el("span", "dot");
    d.style.background = "var(--s" + slot + ")";
    return d;
  }

  function mini(text, fn) {
    var b = el("button", "mini-btn", text);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }

  function dayChip(s, pressed, extraClass, onClick) {
    var b = el("button", "chip day" + (extraClass ? " " + extraClass : ""));
    b.type = "button";
    b.setAttribute("aria-pressed", pressed ? "true" : "false");
    b.appendChild(el("b", null, s.n));
    b.appendChild(el("small", null, prettyDate(s.date, true)));
    b.addEventListener("click", onClick);
    return b;
  }

  /* До первой серии считать нечего — показываем состав отряда, чтобы страница
     не выглядела сломанной. */
  function viewEmpty(host) {
    var card = el("div", "card");
    card.appendChild(el("div", "section-title", "Серий пока нет"));
    host.appendChild(card);

    var sh = el("div", "section-head");
    sh.appendChild(el("span", "section-title", "Отряд"));
    host.appendChild(sh);

    var wrap = el("div", "table-wrap");
    var table = el("table", "data");
    var tbody = el("tbody");
    DATA.students.slice().sort(function (a, b) {
      return a.name.localeCompare(b.name, "ru");
    }).forEach(function (s, i) {
      var tr = el("tr");
      tr.appendChild(el("td", "rank", i + 1));
      tr.appendChild(nameCell("td", "left name", s));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    host.appendChild(wrap);
  }

  function tile(label, value, note) {
    var t = el("div", "tile");
    t.appendChild(el("div", "tile-label", label));
    t.appendChild(el("div", "tile-value", value));
    if (note) t.appendChild(el("div", "tile-note", note));
    return t;
  }

  function th(text, cls) { return el("th", cls, text); }

  // ── фильтры ─────────────────────────────────────────────

  function renderFilters(host) {
    var card = el("div", "card filters");

    // темы
    var r1 = el("div", "filter-row");
    var h1 = el("div", "filter-head");
    h1.appendChild(el("span", "filter-title", "Темы"));
    h1.appendChild(mini("все", function () {
      state.leaves = new Set(LEAVES.map(function (l) { return l.key; }));
      render();
    }));
    h1.appendChild(mini("ни одной", function () {
      state.leaves = new Set();
      render();
    }));
    r1.appendChild(h1);

    DATA.types.forEach(function (t) {
      var leaves = catLeaves(t.id);
      if (!leaves.length) return;
      var on = leaves.filter(function (l) { return state.leaves.has(l.key); }).length;

      var group = el("div", "tgroup");

      var cat = el("button", "chip cat" + (on && on < leaves.length ? " partial" : ""));
      cat.type = "button";
      cat.setAttribute("aria-pressed", on ? "true" : "false");
      cat.appendChild(dot(t.slot));
      cat.appendChild(document.createTextNode(t.name));
      cat.addEventListener("click", function () {
        var all = on === leaves.length;
        leaves.forEach(function (l) {
          if (all) state.leaves.delete(l.key); else state.leaves.add(l.key);
        });
        render();
      });
      group.appendChild(cat);

      if (leaves.length > 1 || leaves[0].subName) {
        var subs = el("div", "subs");
        leaves.forEach(function (l) {
          var b = el("button", "chip sub", l.subName || t.name);
          b.type = "button";
          b.setAttribute("aria-pressed", state.leaves.has(l.key) ? "true" : "false");
          b.style.setProperty("--accent", "var(--s" + t.slot + ")");
          b.addEventListener("click", function () {
            if (state.leaves.has(l.key)) state.leaves.delete(l.key);
            else state.leaves.add(l.key);
            render();
          });
          subs.appendChild(b);
        });
        group.appendChild(subs);
      }

      r1.appendChild(group);
    });
    card.appendChild(r1);

    // вид задания — признак, с темой не связанный
    var r3 = el("div", "filter-row");
    var h3 = el("div", "filter-head");
    h3.appendChild(el("span", "filter-title", "Что считаем"));
    r3.appendChild(h3);

    var c3 = el("div", "chips");
    KINDS.forEach(function (pair) {
      var on = state.kinds.has(pair[0]);
      var b = el("button", "chip", pair[1]);
      b.type = "button";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.addEventListener("click", function () {
        if (on) state.kinds.delete(pair[0]); else state.kinds.add(pair[0]);
        render();
      });
      c3.appendChild(b);
    });
    r3.appendChild(c3);
    card.appendChild(r3);

    // серии
    var r2 = el("div", "filter-row");
    var h2 = el("div", "filter-head");
    h2.appendChild(el("span", "filter-title", "Серии"));
    h2.appendChild(mini("все", function () {
      state.series = new Set(DATA.series.map(function (s) { return s.n; }));
      render();
    }));
    h2.appendChild(mini("последние 5", function () {
      state.series = new Set(DATA.series.slice(-5).map(function (s) { return s.n; }));
      render();
    }));
    h2.appendChild(mini("ни одной", function () {
      state.series = new Set();
      render();
    }));
    r2.appendChild(h2);

    var c2 = el("div", "chips");
    DATA.series.forEach(function (s) {
      c2.appendChild(dayChip(s, state.series.has(s.n), null, function () {
        if (state.series.has(s.n)) state.series.delete(s.n);
        else state.series.add(s.n);
        render();
      }));
    });
    r2.appendChild(c2);
    card.appendChild(r2);

    host.appendChild(card);
    return filtered();
  }

  // ── вид: рейтинг ────────────────────────────────────────

  function viewRating(host) {
    if (!DATA.series.length) return viewEmpty(host);

    var f = renderFilters(host);

    var wrap = el("div", "table-wrap");
    var table = el("table", "data");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(th("№", "rank"));
    hr.appendChild(th("Ученик", "left"));
    hr.appendChild(th("Очки"));
    hr.appendChild(th("Задачи"));
    hr.appendChild(th("Ср. балл"));
    hr.appendChild(th("%", "left"));
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el("tbody");
    f.rows.forEach(function (r) {
      var tr = el("tr", "clickable");
      tr.addEventListener("click", function () {
        state.openStudent = r.id;
        render();
        window.scrollTo(0, 0);
      });

      tr.appendChild(el("td", "rank" + (r.rank <= 3 ? " rank-top" : ""), r.rank));
      tr.appendChild(nameCell("td", "left name", r));
      tr.appendChild(el("td", "score", num(r.score)));
      tr.appendChild(el("td", "muted", r.pluses));
      tr.appendChild(el("td", "muted", avgScore(r.score, r.pluses)));

      var share = f.available ? r.pluses / f.available : 0;
      var td = el("td", "left");
      var track = el("span", "bar-track");
      var bar = el("span", "bar");
      bar.style.width = Math.max(2, Math.round(share * 74)) + "px";
      track.appendChild(bar);
      td.appendChild(track);
      td.appendChild(el("span", "muted", pct(share)));
      tr.appendChild(td);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    // строка «Всего» — сколько очков даёт всё учтённое, если решить целиком
    var tfoot = el("tfoot");
    var fr = el("tr", "total-row");
    fr.appendChild(el("td", "rank"));
    fr.appendChild(el("td", "left name", "Всего"));
    fr.appendChild(el("td", "score", num(f.ceiling)));
    fr.appendChild(el("td", "muted", f.available));
    fr.appendChild(el("td", "muted", avgScore(f.ceiling, f.available)));
    fr.appendChild(el("td", "left muted", "100%"));
    tfoot.appendChild(fr);
    table.appendChild(tfoot);

    wrap.appendChild(table);
    host.appendChild(wrap);
  }

  /* Кондуит собран из двух таблиц: слева фамилии, справа прокручиваемые клетки.
     Раньше столбец фамилий залипал внутри одной таблицы, и на телефоне клетки
     при прокрутке налезали на имена — залипание конфликтует со слоями, которые
     браузер заводит под анимации. Две таблицы такого конфликта не создают.
     Высоты строк заданы жёстко, поэтому половинки идут вровень. */
  function conduitTables(problems, rows, cellFor, footFor) {
    var split = el("div", "conduit-split");

    var names = el("table", "conduit names");
    var nHead = el("thead");
    var nhr = el("tr");
    nhr.appendChild(el("th", "pname", "Ученик"));
    nHead.appendChild(nhr);
    names.appendChild(nHead);

    var nBody = el("tbody");
    rows.forEach(function (r) {
      var tr = el("tr", "crow");
      tr.appendChild(nameCell("td", "pname", r));
      nBody.appendChild(tr);
    });
    names.appendChild(nBody);

    var nFoot = el("tfoot");
    var nf1 = el("tr");
    nf1.appendChild(el("td", "pname", "решили"));
    nFoot.appendChild(nf1);
    var nf2 = el("tr", "weights");
    nf2.appendChild(el("td", "pname", "вес"));
    nFoot.appendChild(nf2);
    names.appendChild(nFoot);
    split.appendChild(names);

    var scroll = el("div", "conduit-scroll");
    var cells = el("table", "conduit cells");

    var thead = el("thead");
    var hr = el("tr");
    problems.forEach(function (p) {
      var leaf = LEAF[leafKey(p.type, p.sub)];
      var slot = leaf ? leaf.slot : (CAT[p.type] ? CAT[p.type].slot : 1);
      var cell = el("th");
      var box = el("div", "phead");
      box.appendChild(el("div", "phead-id", p.id));
      var rule = el("div", "phead-rule");
      rule.style.background = "var(--s" + slot + ")";
      box.appendChild(rule);
      cell.appendChild(box);
      hr.appendChild(cell);
    });
    thead.appendChild(hr);
    cells.appendChild(thead);

    var tbody = el("tbody");
    rows.forEach(function (r) {
      var tr = el("tr", "crow");
      problems.forEach(function (p) {
        var td = el("td", "cell");
        td.appendChild(cellFor(p, r));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    cells.appendChild(tbody);

    var tfoot = el("tfoot");
    var f1 = el("tr");
    var f2 = el("tr", "weights");
    problems.forEach(function (p) {
      var pair = footFor(p);
      f1.appendChild(el("td", null, pair[0]));
      f2.appendChild(el("td", null, pair[1]));
    });
    tfoot.appendChild(f1);
    tfoot.appendChild(f2);
    cells.appendChild(tfoot);

    scroll.appendChild(cells);
    split.appendChild(scroll);
    return split;
  }

  // ── вид: кондуиты ───────────────────────────────────────

  function viewSeries(host) {
    if (!DATA.series.length && !graves().length) {
      var none = el("div", "card");
      none.appendChild(el("div", "section-title", "Кондуитов пока нет"));
      host.appendChild(none);
      return;
    }

    var picker = el("div", "card");

    var r1 = el("div", "filter-row");
    var head = el("div", "filter-head");
    head.appendChild(el("span", "filter-title", "День"));
    r1.appendChild(head);
    var chips = el("div", "chips");
    DATA.series.forEach(function (s) {
      chips.appendChild(dayChip(s, s.n === state.openSeries, "pick", function () {
        state.openSeries = s.n;
        render();
      }));
    });
    r1.appendChild(chips);
    picker.appendChild(r1);

    // гробарий — не день смены, поэтому стоит отдельной строкой, а не в их ряду
    var r2 = el("div", "filter-row");
    var gb = el("button", "chip day wide");
    gb.type = "button";
    gb.setAttribute("aria-pressed", state.openSeries === GRAVES ? "true" : "false");
    gb.appendChild(el("b", null, "Гробарий"));
    gb.addEventListener("click", function () {
      state.openSeries = GRAVES;
      render();
    });
    r2.appendChild(gb);
    picker.appendChild(r2);

    host.appendChild(picker);

    if (state.openSeries === GRAVES) return viewGraveConduit(host);

    var s = DATA.series.filter(function (x) { return x.n === state.openSeries; })[0];
    if (!s) return;

    var units = UNITS.filter(function (u) { return u.sn === s.n; });
    var byId = {};
    units.forEach(function (u) { byId[u.id] = u; });

    var sh = el("div", "section-head");
    sh.appendChild(el("span", "section-title", "Серия " + s.n));
    sh.appendChild(el("span", "section-note", prettyDate(s.date)));
    host.appendChild(sh);

    // строки — в порядке результата этой серии
    var order = computeRating(new Set([s.n]), allLeaves(), ALL_KINDS).rows;

    host.appendChild(conduitTables(s.problems, order, function (p, r) {
      return byId[p.id].solverSet.has(r.id) ? el("div", "mark on", "+") : el("div", "mark");
    }, function (p) {
      return [byId[p.id].solvers.length, byId[p.id].weight];
    }));

    host.appendChild(legend(s.problems));
  }

  /* Гробарий в том же виде, что и день: сетка «ученики × задачи», внизу сколько
     человек взяло гроб и сколько он стоит. Порядок строк — по гробам, а не по
     общему рейтингу: иначе таблица не про них. */
  function viewGraveConduit(host) {
    var list = graves();
    if (!list.length) {
      var none = el("div", "card");
      none.appendChild(el("div", "section-title", "Гробов пока нет"));
      host.appendChild(none);
      return;
    }

    var byId = {};
    UNITS.forEach(function (u) { if (u.kind === "grave") byId[u.id] = u; });

    var sh = el("div", "section-head");
    sh.appendChild(el("span", "section-title", "Гробарий"));
    host.appendChild(sh);

    var order = computeRating(new Set(), allLeaves(), new Set(["grave"])).rows;

    host.appendChild(conduitTables(list, order, function (p, r) {
      return byId[p.id].solverSet.has(r.id) ? el("div", "mark on", "+") : el("div", "mark");
    }, function (p) {
      return [byId[p.id].solvers.length, byId[p.id].weight];
    }));

    host.appendChild(legend(list));
  }

  // легенда — только темы, встретившиеся в этом кондуите
  function legend(problems) {
    var used = {};
    problems.forEach(function (p) { used[leafKey(p.type, p.sub)] = true; });

    var box = el("div", "legend");
    DATA.types.forEach(function (t) {
      var mine = catLeaves(t.id).filter(function (l) { return used[l.key]; });
      if (!mine.length) return;
      var item = el("span", "legend-item");
      item.appendChild(dot(t.slot));
      var names = mine.map(function (l) { return l.subName; }).filter(Boolean);
      item.appendChild(document.createTextNode(
        t.name + (names.length ? " · " + names.join(", ") : "")));
      box.appendChild(item);
    });
    return box;
  }

  // ── вид: ученики ────────────────────────────────────────

  function viewStudentCard(host, id) {
    var back = el("button", "back-btn", "← к рейтингу");
    back.type = "button";
    back.addEventListener("click", function () { state.openStudent = null; render(); });
    host.appendChild(back);

    var student = DATA.students.filter(function (s) { return s.id === id; })[0];
    var f = filtered();
    var row = f.rows.filter(function (r) { return r.id === id; })[0];

    var sh = el("div", "section-head");
    sh.appendChild(nameCell("span", "section-title", student));
    host.appendChild(sh);

    var tiles = el("div", "tiles");
    tiles.appendChild(tile("Место", row.rank + " / " + DATA.students.length, null));
    tiles.appendChild(tile("Очки", num(row.score), "из " + num(f.ceiling)));
    tiles.appendChild(tile("Задачи", row.pluses + " / " + f.available, null));
    var best = bestProblem(id);
    tiles.appendChild(tile("Самый ценный плюс", best ? "+" + best.weight : "—",
      best ? (best.sn === null ? "гроб " + best.id
        : "серия " + best.sn + ", задача " + best.id) : null));
    host.appendChild(tiles);

    var sh2 = el("div", "section-head");
    sh2.appendChild(el("span", "section-title", "По темам"));
    host.appendChild(sh2);

    var card = el("div", "card");
    DATA.types.forEach(function (t) {
      var leaves = catLeaves(t.id);
      if (!leaves.length) return;

      var catStat = statFor(leaves.map(function (l) { return l.key; }), id);
      if (!catStat.total) return;   // тема без задач ничего не говорит

      var block = el("div", "tblock");
      block.appendChild(statLine(t.name, dot(t.slot), catStat, t.slot, false));

      if (leaves.length > 1 || leaves[0].subName) {
        leaves.forEach(function (l) {
          var st = statFor([l.key], id);
          if (!st.total) return;
          block.appendChild(statLine(l.subName || t.name, null, st, t.slot, true));
        });
      }

      card.appendChild(block);
    });
    host.appendChild(card);

    // гробы — списком: их немного, и каждый стоит дорого
    if (graves().length) {
      var sh3 = el("div", "section-head");
      sh3.appendChild(el("span", "section-title", "Гробы"));
      host.appendChild(sh3);

      var box = el("div", "series-mini");
      var mine = UNITS.filter(function (u) {
        return u.kind === "grave" && u.solverSet.has(id);
      });
      if (mine.length) {
        mine.forEach(function (u) {
          var chip = el("span", "smini");
          chip.appendChild(el("b", null, u.id));
          chip.appendChild(document.createTextNode(" +" + u.weight));
          box.appendChild(chip);
        });
      } else {
        box.appendChild(el("span", "muted", "—"));
      }
      host.appendChild(box);
    }

    var sh4 = el("div", "section-head");
    sh4.appendChild(el("span", "section-title", "По сериям"));
    host.appendChild(sh4);
    host.appendChild(seriesTable(id));
  }

  /* Строка «название — шкала — сколько из скольких». Ширины колонок заданы
     жёстко, чтобы шкала стояла на одном месте независимо от длины названия;
     у подтемы шкала мельче, но начинается там же. */
  function statLine(name, mark, stat, slot, small) {
    var line = el("div", "pline" + (small ? " sub" : ""));

    var label = el("span", "pline-name");
    if (mark) label.appendChild(mark);
    label.appendChild(document.createTextNode(name));
    line.appendChild(label);

    line.appendChild(meter(stat.total ? stat.got / stat.total : 0, slot, small));
    line.appendChild(el("span", "pline-val", stat.got + "/" + stat.total));
    return line;
  }

  function seriesTable(id) {
    var wrap = el("div", "table-wrap");
    var table = el("table", "data");

    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(th("Серия", "left"));
    hr.appendChild(th("Задачи"));
    hr.appendChild(th("Очки"));
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el("tbody");
    DATA.series.forEach(function (s) {
      var got = 0, total = 0, score = 0, ceiling = 0;
      UNITS.forEach(function (u) {
        if (u.sn !== s.n) return;
        total += 1;
        ceiling += u.weight;
        if (u.solverSet.has(id)) { got += 1; score += u.weight; }
      });

      var tr = el("tr");
      var first = el("td", "left");
      first.appendChild(el("b", null, s.n));
      first.appendChild(el("span", "muted date", prettyDate(s.date, true)));
      tr.appendChild(first);
      tr.appendChild(el("td", null, got + " / " + total));
      tr.appendChild(el("td", null, num(score) + " / " + num(ceiling)));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    wrap.appendChild(table);
    return wrap;
  }

  function statFor(keys, studentId) {
    var set = new Set(keys);
    var total = 0, got = 0, score = 0;
    UNITS.forEach(function (u) {
      if (u.sn !== null && !state.series.has(u.sn)) return;
      if (!set.has(u.leafKey) || !state.kinds.has(u.kind)) return;
      total += 1;
      if (u.solverSet.has(studentId)) { got += 1; score += u.weight; }
    });
    return { total: total, got: got, score: score };
  }

  /* Шкала набрана мелкими блоками, а не одной заливкой. Причина внешняя: в
     Samsung Internet крупная плоская заливка гаснет, а мелкая — нет; кружок
     темы 9×9 и полоска в кондуите 20×3 приходят нетронутыми, широкая полоса
     решаемости — приглушённой. Побочная польза: долю теперь видно по числу
     закрашенных блоков, а не только по цвету. */
  var METER_STEPS = 10;   // одна шкала на весь сайт: 10 квадратов — это 100%

  function meter(share, slot, small) {
    var box = el("div", "meter" + (small ? " small" : ""));
    var on = Math.round(share * METER_STEPS);
    if (share > 0 && on === 0) on = 1;   // ненулевую долю показываем всегда
    for (var i = 0; i < METER_STEPS; i++) {
      var seg = el("i");
      if (i < on) seg.style.background = "var(--s" + slot + ")";
      box.appendChild(seg);
    }
    return box;
  }

  function bestProblem(id) {
    var best = null;
    UNITS.forEach(function (u) {
      if (!u.solverSet.has(id)) return;
      if (!best || u.weight > best.weight) best = u;
    });
    return best;
  }

  // ── каркас ──────────────────────────────────────────────

  var lastScene = null;
  var enterTimer = null;

  function render() {
    var main = document.getElementById("main");
    clear(main);

    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
      t.setAttribute("aria-selected", t.dataset.view === state.view ? "true" : "false");
    });

    // анимируем только смену раздела или открытие ученика, но не пересчёт фильтра
    var scene = state.view + "/" + (state.openStudent || "");
    if (scene !== lastScene) {
      lastScene = scene;
      main.classList.add("view-enter");
      clearTimeout(enterTimer);
      enterTimer = setTimeout(function () { main.classList.remove("view-enter"); }, 450);
    }

    if (state.view === "rating") {
      if (state.openStudent) viewStudentCard(main, state.openStudent);
      else viewRating(main);
    } else if (state.view === "series") viewSeries(main);
  }

  function setupChrome() {
    document.getElementById("brand-title").textContent = DATA.config.title;
    var sub = DATA.config.subtitle || "";
    if (DATA.config.offline_date) {
      var d = String(DATA.config.offline_date).split("-");
      sub += (sub ? " · " : "") + "офлайн-копия от " + d[2] + "." + d[1] + "." + d[0];
    }
    document.getElementById("brand-sub").textContent = sub;
    document.title = DATA.config.title + " — " + (DATA.config.subtitle || "");

    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
      t.addEventListener("click", function () {
        state.view = t.dataset.view;
        state.openStudent = null;
        render();
      });
    });
  }

  /* Если страница пришла из кэша, а данные уже новее — перезагружаемся по
     адресу с новой меткой: тот же кэш по нему промахнётся и отдаст свежий HTML.
     Метка в адресе заодно защищает от петли: второй раз условие не сработает. */
  function checkStale(config) {
    var meta = document.querySelector('meta[name="build"]');
    var page = meta ? meta.content : null;
    var fresh = config.build;
    if (!page || !fresh || page === fresh) return false;
    if (new URLSearchParams(location.search).get("b") === fresh) return false;
    location.replace(location.pathname + "?b=" + fresh);
    return true;
  }

  function boot(data) {
    if (checkStale(data.config)) return;
    DATA = data;
    DATA.graves = DATA.graves || { problems: [], solved: {} };
    DATA.graves.problems = DATA.graves.problems || [];
    DATA.graves.solved = DATA.graves.solved || {};
    DATA.series.sort(function (a, b) { return a.n - b.n; });
    buildIndex();
    setupChrome();
    render();
  }

  function loadFromFiles() {
    var base = "data/";
    function get(path) {
      return fetch(base + path, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error(path + ": " + r.status);
        return r.json();
      });
    }
    // гробария может не быть — это не повод не открыть сайт
    var soft = get("graves.json").catch(function () {
      return { problems: [], solved: {} };
    });
    return Promise.all([
      get("config.json"), get("types.json"), get("students.json"),
      get("series/manifest.json"), soft
    ]).then(function (res) {
      return Promise.all(res[3].series.map(function (f) { return get("series/" + f); }))
        .then(function (series) {
          return {
            config: res[0], types: res[1], students: res[2],
            series: series, graves: res[4]
          };
        });
    });
  }

  /* Отклик на касание сделан классом и анимацией, а не :active. На телефоне
     :active почти не виден: браузер придерживает его, пока не поймёт, что
     касание — не начало прокрутки, и на быстром тапе состояние успевает
     появиться и исчезнуть за несколько миллисекунд. Анимация же, раз начавшись,
     доигрывает до конца независимо от того, как долго держали палец. */
  var TAPPABLE = "button:not(.mark), .chip, a.ghost-btn, tr.clickable, .smini";

  function enableTapFeedback() {
    document.addEventListener("pointerdown", function (e) {
      var node = e.target.closest && e.target.closest(TAPPABLE);
      if (!node || node.disabled) return;
      node.classList.remove("tap");
      void node.offsetWidth;      // перезапуск анимации на повторном касании
      node.classList.add("tap");
    }, { passive: true });
  }

  document.addEventListener("DOMContentLoaded", function () {
    enableTapFeedback();
    if (window.__CONDUIT__) { boot(window.__CONDUIT__); return; }
    loadFromFiles().then(boot).catch(function (err) {
      var main = document.getElementById("main");
      clear(main);
      var box = el("div", "card");
      box.appendChild(el("div", "section-title", "Не удалось загрузить данные"));
      box.appendChild(el("div", "tile-note", String(err.message || err)));
      main.appendChild(box);
    });
  });
})();

</script>
</body>
</html>
